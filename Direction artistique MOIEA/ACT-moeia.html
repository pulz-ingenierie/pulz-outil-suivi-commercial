  <script>
    function __showError(msg) {
      const overlay = document.getElementById('__error_overlay');
      const text = document.getElementById('__error_text');
      text.textContent = msg;
      overlay.classList.add('visible');
    }
    // Intercepter console.error qui est l'endroit où Babel rapporte ses erreurs de transformation
    const __origConsoleError = console.error;
    console.error = function(...args) {
      try {
        const msg = args.map(a => {
          if (a == null) return String(a);
          if (a instanceof Error) return (a.stack || a.message || String(a));
          if (typeof a === 'object') {
            try { return JSON.stringify(a, null, 2); } catch { return String(a); }
          }
          return String(a);
        }).join(' ');
        // Notes de performance Babel (ex : "[BABEL] Note: ... deoptimised ... 500KB")
        // ne sont PAS des erreurs : ne pas bloquer l'app dessus.
        const estNoteBenigne = /\[BABEL\]\s*Note:/i.test(msg) || /deoptimised|exceeds the max of/i.test(msg);
        // Si l'erreur vient de Babel ou de l'app, l'afficher
        if (!estNoteBenigne && msg && /SyntaxError|ReferenceError|TypeError|Babel|Unexpected|Cannot|undefined/i.test(msg)) {
          __showError(msg);
        }
      } catch {}
      return __origConsoleError.apply(console, args);
    };
    // Capturer aussi les erreurs window non-CORS
    window.addEventListener('error', e => {
      const msg = (e.error && (e.error.stack || e.error.message)) || e.message || String(e);
      // "Script error." est un message générique CORS — on l'ignore si vide
      if (msg && msg !== 'Script error.') {
        __showError(msg);
      } else if (e.filename || e.lineno) {
        __showError(`Erreur dans ${e.filename || '(inconnu)'} ligne ${e.lineno || '?'} colonne ${e.colno || '?'} — détails masqués (CORS). Vérifie la console du navigateur (F12) pour le détail.`);
      }
    });
    window.addEventListener('unhandledrejection', e => {
      __showError('Promise non gérée : ' + ((e.reason && e.reason.stack) || e.reason || ''));
    });
  </script>

  <!-- Stockage window.storage via IndexedDB (pas de limite 5 Mo de localStorage).
       Même interface async get/set/delete/list que précédemment, donc transparent
       pour le reste de l'app. Migration automatique des anciennes données localStorage. -->
  <script>
    (function () {
      const DB_NAME = 'buscot_act_db';
      const STORE = 'kv';
      let dbPromise = null;

      function openDB() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        return dbPromise;
      }

      function tx(mode, fn) {
        return openDB().then(db => new Promise((resolve, reject) => {
          const t = db.transaction(STORE, mode);
          const store = t.objectStore(STORE);
          const result = fn(store);
          t.oncomplete = () => resolve(result.value !== undefined ? result.value : result);
          t.onerror = () => reject(t.error);
          t.onabort = () => reject(t.error);
        }));
      }

      window.storage = {
        get: async (key) => {
          const v = await tx('readonly', (store) => {
            const r = store.get(key);
            const box = {};
            r.onsuccess = () => { box.value = r.result; };
            return box;
          });
          return (v !== undefined && v !== null) ? { value: v } : null;
        },
        set: async (key, value) => {
          await tx('readwrite', (store) => { store.put(value, key); return {}; });
          return { value };
        },
        delete: async (key) => {
          await tx('readwrite', (store) => { store.delete(key); return {}; });
          return { deleted: true };
        },
        list: async (prefix) => {
          const keys = await tx('readonly', (store) => {
            const r = store.getAllKeys();
            const box = {};
            r.onsuccess = () => { box.value = (r.result || []).filter(k => !prefix || String(k).startsWith(prefix)); };
            return box;
          });
          return { keys: keys || [] };
        },
      };

      // Migration unique : récupérer d'éventuelles données de l'ancien localStorage.
      window.__storageReady = (async () => {
        try {
          const migDone = await window.storage.get('__migrated_from_localstorage');
          if (!migDone) {
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k && k.startsWith('buscot_act_')) {
                const cle = k.slice('buscot_act_'.length);
                const val = localStorage.getItem(k);
                if (val != null) { try { await window.storage.set(cle, val); } catch (e) {} }
              }
            }
            await window.storage.set('__migrated_from_localstorage', '1');
          }
        } catch (e) { console.warn('Migration localStorage→IndexedDB ignorée :', e); }
      })();
    })();
  </script>

const AI_MODEL='claude-sonnet-4-6';// Aligné sur pulz-outil-ao
const AI_TEMPERATURE_DEFAULT=0.3;// Rédaction stable et prévisible
// Identité éditoriale BUSCOT — utilisée comme préfixe de tous les prompts système
const SYSTEM_PROMPT_BUSCOT=`Tu rédiges pour BUSCOT ENERGIES, bureau d'études techniques (BET) spécialisé en fluides, électricité et CVC.

Style éditorial à respecter strictement :
- Ton FACTUEL et SOBRE, sans emphase commerciale
- Formules types : "Au regard de ces éléments...", "En l'état, l'offre technique apparaît...", "Sur la base des pièces remises..."
- Pas de superlatifs ("excellent", "remarquable", "exceptionnel") — préférer "satisfaisant", "complet", "lacunaire", "perfectible"
- Phrases courtes, structure claire, pas de redondance
- Vocabulaire technique métier : DPGF, CCTP, RC, BET, MOA, écart vs estimation, recevabilité
- Conclusions nuancées : indiquer ce qui est apporté ET ce qui manque
- Ne jamais inventer d'éléments qui ne figurent pas dans les pièces analysées
- Si une information n'est pas disponible : le dire explicitement ("le dossier ne comporte pas...", "aucun élément ne permet de...")
- Rester courtois mais sans complaisance envers les entreprises analysées`;/**

const rawText=await response.text();let data;try{data=JSON.parse(rawText);}catch(e){if(response.status===504||/timeout/i.test(rawText)){throw new Error("L'IA a mis trop de temps à répondre (timeout). Le document est probablement trop volumineux.");}throw new Error('Réponse inattendue du serveur (HTTP '+response.status+') : '+rawText.slice(0,200));}if(!response.ok){const msg=data?.error?.message||data?.error||'HTTP '+response.status;throw new Error(msg);}const stopReason=data.stop_reason||'';if(stopReason==='max_tokens'){throw new Error("La réponse de l'IA a été tronquée (limite de tokens atteinte).");}return{text:(data.content||[]).map(b=>b.text||'').join('\n'),usage:data.usage||{},model:data.model||'',stop_reason:stopReason};}/**

 */function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const dataUrl=reader.result;const base64=String(dataUrl).split(',')[1]||'';resolve(base64);};reader.onerror=()=>reject(new Error('Échec lecture fichier '+(file.name||'')));reader.readAsDataURL(file);});}/**
