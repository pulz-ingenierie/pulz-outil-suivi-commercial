// --- Encart « Après synthèse » : points de précision répondables (volet 2) -----
// Précisions d'EXÉCUTION non bloquantes (le cadrage reste suffisant). Répondre =
// matériel validé -> périme le contexte -> re-synthèse sur l'onglet Contexte.
function PointsAPreciser({ client, projet, pointsRepondus, onAllerContexte }) {
  const phase = projet.phase;
  const [points, setPoints] = useState(null);
  const [ptDrafts, setPtDrafts] = useState({});

  const charger = useCallback(async () => {
    const { data } = await client.from('points_contexte')
      .select('id,texte,reponse,statut').eq('projet_id', projet.id).eq('phase', phase)
      .neq('statut', 'obsolete').order('created_at', { ascending: true });
    setPoints(data || []);
  }, [client, projet.id, phase]);
  useEffect(() => { charger(); const t = setInterval(charger, 4000); return () => clearInterval(t); }, [charger]);

  const repondrePoint = async (p) => {
    const rep = ptDrafts[p.id] != null ? ptDrafts[p.id] : (p.reponse || '');
    await client.from('points_contexte').update({ reponse: rep, statut: 'repondu' }).eq('id', p.id);
    await charger();
  };
  const pourMoaPoint = async (p) => {
    await client.from('points_contexte').update({ statut: 'pour_moa' }).eq('id', p.id);
    await charger();
  };

  if (points === null) return <Carte className="p-5"><p className="text-sm text-slate-400">Chargement…</p></Carte>;

  return (
    <Carte className="p-5">
      <h3 className="font-semibold text-slate-800 mb-1">Précisions d'exécution (optionnel)</h3>
      <p className="text-xs text-slate-500 mb-3">Le cadrage reste suffisant sans elles. Répondez pour enrichir le contexte (re-synthétisez ensuite pour intégrer) ou escaladez à la maîtrise d'ouvrage.</p>
      {(pointsRepondus || []).length > 0 && (
        <div className="mb-3 p-3 rounded-lg border border-brand-200 bg-brand-50 flex items-center gap-3 flex-wrap">
          <span className="text-sm text-brand-800">🔄 Réponses non intégrées : {(pointsRepondus || []).join(' ; ')}</span>
          <span className="flex-1" />
          <Bouton variant="secondaire" onClick={onAllerContexte}>Aller au contexte</Bouton>
        </div>
      )}
      {points.length === 0 && <p className="text-xs text-slate-500">Aucune précision en attente (générées à la synthèse du contexte).</p>}
      <div className="space-y-3">
        {points.map((p) => (
          <div key={p.id} className="border border-slate-200 rounded-lg p-3 bg-white">
            <div className="flex items-start gap-2 mb-2">
              <p className="text-sm text-slate-800 flex-1">{p.texte}</p>
              {p.statut === 'repondu' && <Badge ton="ok">✅ répondu</Badge>}
              {p.statut === 'pour_moa' && <Badge ton="marque">📮 pour MOA</Badge>}
            </div>
            <textarea className="w-full border rounded-lg px-3 py-2 text-sm text-slate-700 font-sans"
              rows={2} placeholder="Votre réponse (précision)…"
              value={ptDrafts[p.id] != null ? ptDrafts[p.id] : (p.reponse || '')}
              onChange={(e) => setPtDrafts((d) => ({ ...d, [p.id]: e.target.value }))} />
            <div className="flex gap-2 mt-2">
              <Bouton variant="secondaire" onClick={() => repondrePoint(p)}>Répondre</Bouton>
              <Bouton variant="ghost" onClick={() => pourMoaPoint(p)}>Pour la MOA</Bouton>
            </div>
          </div>
        ))}
      </div>
    </Carte>
  );
}

// --- Petite liste éditable (chips texte) réutilisée par le contexte -----------
function ListeEditable({ titre, accent, items, onChange }) {
  const arr = items || [];
  return (
    <div>
      <p className={'text-sm font-semibold mb-1 ' + (accent || 'text-slate-700')}>{titre}</p>
      <div className="space-y-1.5">
        {arr.length === 0 && <p className="text-xs text-slate-400">—</p>}
        {arr.map((it, i) => (
          <div key={i} className="flex gap-2">
            <input className="flex-1 border rounded-lg px-2 py-1 text-sm text-slate-700"
              value={it} onChange={(e) => onChange(arr.map((x, j) => (j === i ? e.target.value : x)))} />
            <button className="text-slate-400 hover:text-red-600 px-1" onClick={() => onChange(arr.filter((_, j) => j !== i))}>×</button>
          </div>
        ))}
      </div>
      <button className="text-xs text-brand-600 hover:underline mt-1.5" onClick={() => onChange(arr.concat(['']))}>+ ajouter</button>
    </div>
  );
}

const CHAMPS_SYNTHESE = [
  { k: 'equipements_presents', l: 'Équipements présents' },
  { k: 'equipements_absents', l: 'Équipements absents' },
  { k: 'exclusions', l: 'Exclusions' },
  { k: 'contraintes', l: 'Contraintes' }
];

// --- Onglet CONTEXTE : synthèse éditable + validation (protégée) --------------
function OngletContexte({ client, projet, perime, nouvellesPieces, pointsRepondus }) {
  const phase = projet.phase;
  const [ctx, setCtx] = useState(undefined);         // undefined=chargement, null=absent
  const [form, setForm] = useState(null);            // { contenu, synthese:{...} }
  const [actif, setActif] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState('');
  const dirty = useRef(false);                        // l'utilisateur a édité
  const synced = useRef(null);                        // updated_at déjà chargé dans le form

  const charger = useCallback(async () => {
    const { data } = await client.from('contexte_projet').select('*')
      .eq('projet_id', projet.id).eq('phase', phase).maybeSingle();
    setCtx(data || null);
    const { data: jobs } = await client.from('generation_jobs')
      .select('type').eq('projet_id', projet.id).in('statut', ['en_attente', 'en_cours']);
    setActif((jobs || []).some((j) => j.type === 'contexte_synthese'));
  }, [client, projet.id, phase]);
  useEffect(() => { charger(); const t = setInterval(charger, 4000); return () => clearInterval(t); }, [charger]);

  // Initialise/rafraîchit le formulaire depuis la base tant que l'utilisateur
  // n'a pas commencé à éditer (affiche une re-synthèse fraîche sans écraser une saisie).
  useEffect(() => {
    if (ctx && !dirty.current && ctx.updated_at !== synced.current) {
      const sj = ctx.synthese_json || {};
      setForm({
        contenu: ctx.contenu || '',
        synthese: {
          equipements_presents: sj.equipements_presents || [],
          equipements_absents: sj.equipements_absents || [],
          exclusions: sj.exclusions || [],
          contraintes: sj.contraintes || []
          // points_a_preciser : géré à part dans points_contexte (volet 2)
        }
      });
      synced.current = ctx.updated_at;
    }
  }, [ctx]);

  const editForm = (maj) => { dirty.current = true; setMsg(''); setForm(maj); };
  const majSynthese = (k, v) => editForm({ ...form, synthese: { ...form.synthese, [k]: v } });

  const synthetiser = async (force) => {
    if (force && !window.confirm('Re-synthétiser écrasera le contenu actuel (y compris vos retouches). Continuer ?')) return;
    setBusy(true); setErr('');
    try {
      await client.from('generation_jobs').insert({
        projet_id: projet.id, type: 'contexte_synthese', statut: 'en_attente',
        payload_json: force ? { projet_id: projet.id, phase, force: true } : { projet_id: projet.id, phase }
      });
      await pousserWorker(client);
      dirty.current = false;                           // on acceptera le résultat frais
      await charger();
    } catch (e) { setErr(e.message || String(e)); }
    setBusy(false);
  };

  const enregistrer = async (valider) => {
    setBusy(true); setErr(''); setMsg('');
    try {
      const { error } = await client.from('contexte_projet').update({
        contenu: form.contenu, synthese_json: form.synthese,
        statut: valider ? 'valide' : 'en_construction', updated_at: new Date().toISOString()
      }).eq('id', ctx.id);
      if (error) throw error;
      dirty.current = false; synced.current = null;    // resync au prochain charger
      setMsg(valider ? 'Contexte validé.' : 'Enregistré.');
      await charger();
    } catch (e) { setErr(e.message || String(e)); }
    setBusy(false);
  };

  if (ctx === undefined) return <Carte className="p-6"><p className="text-sm text-slate-400">Chargement…</p></Carte>;

  if (ctx === null) {
    return (
      <Carte className="p-6">
        <h2 className="font-semibold text-slate-800 mb-1">Contexte du projet — phase {libelle(PHASES, phase)}</h2>
        <p className="text-sm text-slate-500 mb-4">Synthèse factuelle qui oriente la suite. Puise dans le brief, les pièces extraites et les réponses validées de l'entonnoir.</p>
        {actif
          ? <p className="text-sm text-amber-700">Synthèse en cours…</p>
          : <Bouton onClick={() => synthetiser(false)} disabled={busy}>{busy ? '…' : 'Synthétiser le contexte'}</Bouton>}
        {err && <p className="text-sm text-red-600 mt-3">{err}</p>}
      </Carte>
    );
  }

  const valide = ctx.statut === 'valide';
  return (
    <div className="space-y-4">
      {perime && (
        <Carte className="p-4 border-amber-200 bg-amber-50">
          <div className="flex items-center gap-3 flex-wrap">
            <span className="text-sm text-amber-800">🔄 Du matériel récent n'est pas intégré : le contexte n'est plus à jour depuis la dernière synthèse.</span>
            <span className="flex-1" />
            <Bouton variant="secondaire" onClick={() => synthetiser(valide)} disabled={busy || actif}>Re-synthétiser</Bouton>
          </div>
          {(nouvellesPieces || []).length > 0 &&
            <p className="text-xs text-amber-700 mt-2">Nouvelles pièces : {(nouvellesPieces || []).join(', ')}</p>}
          {(pointsRepondus || []).length > 0 &&
            <p className="text-xs text-amber-700 mt-2">Réponses à intégrer : {(pointsRepondus || []).join(' ; ')}</p>}
        </Carte>
      )}
      <Carte className="p-4 flex items-center gap-3 flex-wrap">
        <h2 className="font-semibold text-slate-800">Contexte — phase {libelle(PHASES, phase)}</h2>
        <Badge ton={valide ? 'ok' : 'cours'}>{valide ? 'validé' : 'en construction'}</Badge>
        {actif && <span className="text-sm text-amber-700">Synthèse en cours…</span>}
        <span className="flex-1" />
        <Bouton variant="secondaire" onClick={() => synthetiser(valide)} disabled={busy || actif}>Re-synthétiser</Bouton>
        <Bouton variant="secondaire" onClick={() => enregistrer(false)} disabled={busy || !form}>Enregistrer</Bouton>
        <Bouton onClick={() => enregistrer(true)} disabled={busy || !form}>Valider le contexte</Bouton>
      </Carte>
      {msg && <p className="text-sm text-green-700">{msg}</p>}
      {err && <p className="text-sm text-red-600">{err}</p>}

      {form && (
        <div className="space-y-4">
          <Carte className="p-5">
            <div className="flex items-center gap-2 mb-2">
              <h3 className="font-semibold text-slate-800">Contenu</h3>
              {ctx.contenu_complet === false && <Badge ton="cours">contenu tronqué — régénérer</Badge>}
            </div>
            {ctx.contenu_complet === false && (
              <p className="text-xs text-amber-700 mb-2">La prose a été coupée (limite de longueur). Le pilote (listes ci-dessous) reste fiable. Vous pouvez « Re-synthétiser » pour régénérer la prose.</p>
            )}
            <textarea className="w-full border rounded-lg px-3 py-2 text-sm text-slate-700 font-sans"
              rows={Math.min(30, Math.max(8, Math.ceil((form.contenu || '').length / 80)))}
              value={form.contenu} onChange={(e) => editForm({ ...form, contenu: e.target.value })} />
          </Carte>

          <Carte className="p-5 grid md:grid-cols-2 gap-5">
            {CHAMPS_SYNTHESE.map((c) => (
              <ListeEditable key={c.k} titre={c.l} items={form.synthese[c.k]} onChange={(v) => majSynthese(c.k, v)} />
            ))}
          </Carte>

        </div>
      )}
    </div>
  );
}

const tonStatutIngestion = {
  analyse: 'cours', a_valider: 'marque', capitalise: 'ok', erreur: 'erreur'
};
const libelleStatutIngestion = {
  analyse: 'Analyse IA en cours…', a_valider: 'À valider', capitalise: 'Capitalisé', erreur: 'Erreur'
};

// ============================================================================
// ADMIN — ÉCRAN DÉPÔT D'UN CCTP (étape 1 : dépôt → analyse IA)
// ============================================================================
function EcranDepotCCTP({ client, user, onAnnuler, onDepose }) {
  const [fichier, setFichier] = useState(null);
  const [source, setSource] = useState('');
  const [typologie, setTypologie] = useState('');
  const [busy, setBusy] = useState(false);
  const [etape, setEtape] = useState('');
  const [err, setErr] = useState(null);

  const choisir = (f) => {
    if (!f) return;
    setFichier(f);
    if (!source) setSource(f.name.replace(/\.(docx|pdf)$/i, ''));
    setErr(null);
  };

  const deposer = async () => {
    if (!fichier) { setErr('Choisissez un fichier .docx ou .pdf.'); return; }
    if (!source.trim()) { setErr('Indiquez le nom de la source (ex. « CCTP Chooz »).'); return; }
    const estDocx = /\.docx$/i.test(fichier.name);
    const estPdf = /\.pdf$/i.test(fichier.name);
    if (!estDocx && !estPdf) { setErr('Format non supporté : seuls .docx et .pdf sont acceptés.'); return; }

    setBusy(true); setErr(null);
    try {
      let texte_source = null, fichier_path = null;

      if (estDocx) {
        setEtape('Extraction du texte (.docx)…');
        const buf = await fichier.arrayBuffer();
        const res = await window.mammoth.extractRawText({ arrayBuffer: buf });
        texte_source = (res && res.value || '').trim();
        if (!texte_source) throw new Error('Aucun texte extrait du .docx.');
      } else {
        setEtape('Téléversement du PDF…');
        fichier_path = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())) + '.pdf';
        const { error: upErr } = await client.storage
          .from('cctp_sources').upload(fichier_path, fichier, { contentType: 'application/pdf' });
        if (upErr) throw upErr;
      }

      setEtape('Création de l\'ingestion…');
      const { data: ing, error: insErr } = await client.from('ingestions').insert({
        source_cctp: source.trim(),
        lot: 'CVCP',
        typologie: typologie || null,
        fichier_path, texte_source,
        statut: 'analyse',
        cree_par: user.id
      }).select().single();
      if (insErr) throw insErr;

      setEtape('Mise en file de l\'analyse IA…');
      await client.from('generation_jobs').insert({
        projet_id: null,
        type: 'ingestion_analyse',
        statut: 'en_attente',
        total_sections: 1,
        payload_json: { ingestion_id: ing.id }
      });

      await pousserWorker(client);
      onDepose();
    } catch (e) {
      setErr('Erreur : ' + (e.message || e));
      setBusy(false);
      setEtape('');
    }
  };

  return (
    <div className="max-w-2xl mx-auto px-4 py-8">
      <button onClick={onAnnuler} className="text-sm text-slate-500 hover:underline mb-4">← Mine d'or</button>
      <h1 className="text-2xl font-bold text-slate-800 mb-1">Déposer un CCTP</h1>
      <p className="text-sm text-slate-500 mb-6">
        L'IA découpe le document en fragments et propose le tagging. <strong>Vous validez ensuite</strong> avant
        toute entrée dans la mine d'or.
      </p>

      <Carte className="p-6 space-y-5">
        <label className="block border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:border-brand-400 transition-colors"
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => { e.preventDefault(); choisir(e.dataTransfer.files[0]); }}>
          <input type="file" accept=".docx,.pdf" className="hidden"
            onChange={(e) => choisir(e.target.files[0])} />
          {fichier
            ? <p className="text-slate-700 font-medium">{fichier.name}</p>
            : <p className="text-slate-500 text-sm">Glissez un fichier <strong>.docx</strong> ou <strong>.pdf</strong> ici, ou cliquez pour parcourir</p>}
        </label>

        <div>
          <label className="block text-sm font-medium text-slate-700 mb-1.5">Nom de la source</label>
          <input className="w-full border rounded-lg px-3 py-2 text-sm" placeholder="ex. CCTP Chooz"
            value={source} onChange={(e) => setSource(e.target.value)} />
          <p className="text-xs text-slate-400 mt-1">Tracera l'origine de chaque fragment (champ source_cctp).</p>
        </div>

        <div>
          <label className="block text-sm font-medium text-slate-700 mb-1.5">Typologie (optionnelle)</label>
          <div className="flex flex-wrap gap-2">
            <button type="button" onClick={() => setTypologie('')}
              className={'text-sm rounded-lg px-3 py-1.5 border ' + (typologie === '' ? 'border-brand-600 bg-brand-50 text-brand-700 font-medium' : 'border-slate-300 text-slate-600 hover:bg-slate-50')}>
              Laisser l'IA déduire
            </button>
            {TYPOLOGIES.map(o => (
              <button key={o.v} type="button" onClick={() => setTypologie(o.v)}
                className={'text-sm rounded-lg px-3 py-1.5 border ' + (typologie === o.v ? 'border-brand-600 bg-brand-50 text-brand-700 font-medium' : 'border-slate-300 text-slate-600 hover:bg-slate-50')}>
                {o.l}
              </button>
            ))}
          </div>
        </div>

        {err && <p className="text-sm text-red-600">{err}</p>}

        <div className="flex items-center gap-3 pt-1">
          <Bouton onClick={deposer} disabled={busy}>{busy ? '…' : 'Déposer et analyser'}</Bouton>
          <Bouton variant="secondaire" onClick={onAnnuler} disabled={busy}>Annuler</Bouton>
          {busy && etape && <span className="text-xs text-slate-500">{etape}</span>}
        </div>
      </Carte>
    </div>
  );
}

// ============================================================================
// ADMIN — ÉCRAN RELECTURE (VALIDATION #1, fluide : tout valider en 1 clic)
// ============================================================================
function EcranRelectureIngestion({ client, ingestionId, onRetour }) {
  const [ing, setIng] = useState(null);   // null = chargement
  const [frags, setFrags] = useState([]);
  const [arbre, setArbre] = useState([]);   // nœuds chapitres_ref du lot (arbre canonique)
  const [metiers, setMetiers] = useState([]);   // référentiel métiers du lot (signets)
  const [creer, setCreer] = useState(null);     // { i, libelle, parentId } : création de nœud inline
  const [plies, setPlies] = useState({});       // pliage : par clé de groupe ('g:'+nid / '__hors__') ET par nid de nœud interne
  const [voisins, setVoisins] = useState({});   // affichage des voisins document, par nid (toggle manuel)
  const [posAligner, setPosAligner] = useState(0);          // position dans la file « à aligner »
  const [scroll, setScroll] = useState({ nid: null, t: 0 }); // cible de défilement (t = tick pour re-déclencher)
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [msg, setMsg] = useState(null);

  const toArr = (v) => (Array.isArray(v) ? v : (v ? [v] : []));

  useEffect(() => {
    (async () => {
      const { data } = await client.from('ingestions').select('*').eq('id', ingestionId).single();
      setIng(data || false);
      if (!data) return;
      let noeuds = [];
      if (data.lot) {
        const { data: ns } = await client.from('chapitres_ref')
          .select('id,libelle,niveau,parent_id,ordre,chemin_mat').eq('actif', true).eq('lot', data.lot);
        noeuds = ns || [];
        setArbre(noeuds);
        const { data: met } = await client.from('metiers').select('libelle').eq('actif', true).eq('lot', data.lot);
        setMetiers((met || []).map((m) => m.libelle));
      }
      // Pré-remplissage de l'ALIGNEMENT : la proposition IA (libellé) est résolue en
      // id si elle matche un nœud UNIQUE -> l'humain ne traite plus que les « à aligner ».
      const parLib = new Map();
      for (const n of noeuds) (parLib.get(n.libelle) || parLib.set(n.libelle, []).get(n.libelle)).push(n);
      setFrags(((data.fragments_json) || []).map((f) => {
        let refId = f.chapitre_ref_id || null;
        if (!refId && f.chapitre_ref) {
          const m = parLib.get(f.chapitre_ref);
          if (m && m.length === 1) refId = m[0].id;
        }
        return { ...f, metier_sous_lot: toArr(f.metier_sous_lot), chapitre_ref_id: refId };
      }));
    })();
  }, [client, ingestionId]);

  // Nœuds dans l'ORDRE DE L'ARBRE (DFS, trié par ordre) -> options indentées du select.
  const arbreOrdonne = useMemo(() => {
    const enfants = new Map();
    for (const n of arbre) {
      const k = n.parent_id || '';
      (enfants.get(k) || enfants.set(k, []).get(k)).push(n);
    }
    for (const lst of enfants.values()) lst.sort((a, b) => (a.ordre - b.ordre) || a.libelle.localeCompare(b.libelle));
    const out = [];
    const walk = (k) => { for (const n of (enfants.get(k) || [])) { out.push(n); walk(n.id); } };
    walk('');
    return out;
  }, [arbre]);
  const noeudParId = useMemo(() => new Map(arbre.map((n) => [n.id, n])), [arbre]);

  // Arbre SOURCE réel (nid/parent_nid, §15) : groupes pliables par RACINE + pliage
  // PAR NŒUD INTERNE (un nœud replié masque son sous-arbre). Profondeur = chaîne
  // parent_nid (= ce qui sera capitalisé). On détecte aussi les nœuds EXCLUS ayant
  // ≥1 descendant RETENU (avertissement de re-rattachement) et on calcule la taille
  // de chaque sous-arbre (compteur de chapitre).
  const { groupes, idxByNid, aEnfants, exclusionProb } = useMemo(() => {
    const idxByNid = new Map(frags.map((f, i) => [f.nid, i]));
    const enfants = new Map();                      // parent_nid -> [index], ordre document
    frags.forEach((f, i) => {
      const k = (f.parent_nid == null) ? '__root__' : f.parent_nid;
      (enfants.get(k) || enfants.set(k, []).get(k)).push(i);
    });
    const aEnfants = new Set(frags.map((f) => f.parent_nid).filter((x) => x != null));
    // pré-ordre + profondeur ; un nœud REPLIÉ (plies[nid]) masque son sous-arbre.
    const sousArbre = (i, depth, out) => {
      out.push({ f: frags[i], i, depth });
      if (plies[frags[i].nid]) return;
      for (const c of (enfants.get(frags[i].nid) || [])) sousArbre(c, depth + 1, out);
    };
    const taille = (i) => { let n = 1; for (const c of (enfants.get(frags[i].nid) || [])) n += taille(c); return n; };
    const out = [], hors = { key: '__hors__', num: null, titre: '(hors arborescence)', items: [], total: 0 };
    for (const ri of (enfants.get('__root__') || [])) {
      const f = frags[ri];
      if (f.ordre_chapitre || f.niveau) {           // racine = vrai chapitre -> groupe pliable
        const items = []; sousArbre(ri, 0, items);
        out.push({ key: 'g:' + f.nid, num: f.ordre_chapitre, titre: f.titre || ('#' + (ri + 1)), items, total: taille(ri) });
      } else {                                      // racine sans ordre -> hors arborescence
        sousArbre(ri, 0, hors.items); hors.total += taille(ri);
      }
    }
    if (hors.items.length) out.push(hors);
    // Exclus ayant ≥1 descendant retenu (le constructeur les re-rattache au plus
    // proche ancêtre retenu) -> on l'AVERTIT à la relecture.
    const aRetenu = (i) => {
      let r = frags[i].garder !== false;
      for (const c of (enfants.get(frags[i].nid) || [])) r = aRetenu(c) || r;
      return r;
    };
    const exclusionProb = new Set();
    frags.forEach((f) => {
      if (f.garder !== false) return;
      if ((enfants.get(f.nid) || []).some((c) => aRetenu(c))) exclusionProb.add(f.nid);
    });
    return { groupes: out, idxByNid, aEnfants, exclusionProb };
  }, [frags, plies]);

  // Plus proche ancêtre (chaîne parent_nid) DÉJÀ ALIGNÉ -> pour « aligner comme le parent ».
  const ancetreAligne = (f) => {
    let p = (f.parent_nid != null) ? idxByNid.get(f.parent_nid) : undefined, g = 0;
    while (p !== undefined && g++ < 50) {
      const pf = frags[p];
      if (pf.chapitre_ref_id) return pf.chapitre_ref_id;
      p = (pf.parent_nid != null) ? idxByNid.get(pf.parent_nid) : undefined;
    }
    return null;
  };

  // File « À TRAITER » = à aligner (retenu, sans chapitre_ref_id), en ordre document.
  const aTraiter = useMemo(() => frags.filter((f) => f.garder !== false && !f.chapitre_ref_id).map((f) => f.nid), [frags]);

  // Va à un nœud : déplie toute la chaîne d'ancêtres + le groupe, puis fait défiler.
  const allerA = (nid) => {
    const ci = idxByNid.get(nid);
    if (ci === undefined) return;
    setPlies((prev) => {
      const np = { ...prev };
      let p = ci, g = 0, root = frags[ci];
      while (p !== undefined && g++ < 50) {
        const pf = frags[p]; np[pf.nid] = false; root = pf;
        p = (pf.parent_nid != null) ? idxByNid.get(pf.parent_nid) : undefined;
      }
      np[(root.ordre_chapitre || root.niveau) ? ('g:' + root.nid) : '__hors__'] = false;
      return np;
    });
    setScroll((s) => ({ nid, t: s.t + 1 }));
  };
  const naviguer = (delta) => {
    if (!aTraiter.length) return;
    const n = aTraiter.length, cur = ((posAligner % n) + n) % n, np = (((cur + delta) % n) + n) % n;
    setPosAligner(np); allerA(aTraiter[np]);
  };
  // Défile vers la cible APRÈS rendu (le groupe vient peut-être d'être déplié).
  useEffect(() => {
    if (scroll.nid == null) return;
    const el = document.getElementById('frag-' + scroll.nid);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, [scroll]);

  const majFrag = (i, champ, val) => setFrags((fr) => fr.map((f, k) => (k === i ? { ...f, [champ]: val } : f)));
  const toggle = (key) => setPlies((p) => ({ ...p, [key]: !p[key] }));

  const nbGardes = frags.filter((f) => f.garder !== false).length;
  // Garde-fou SOFT : compteur « à aligner » (jamais de blocage).
  const nbAAligner = frags.filter((f) => f.garder !== false && !f.chapitre_ref_id).length;

  // Crée un NŒUD canonique (persisté ; le trigger pose niveau/chemin_mat), puis aligne.
  const creerNoeud = async () => {
    const lib = (creer.libelle || '').trim();
    if (!lib) { setErr('Libellé du nœud vide.'); return; }
    setBusy(true); setErr(null);
    try {
      let { data: noeud, error } = await client.from('chapitres_ref')
        .insert({ lot: ing.lot, libelle: lib, parent_id: creer.parentId || null, cree_par: 'utilisateur' })
        .select('id,libelle,niveau,parent_id,ordre,chemin_mat').single();
      if (error) {
        if (error.code !== '23505') throw error;          // 23505 = existe déjà -> on le récupère
        const { data: ex } = await client.from('chapitres_ref')
          .select('id,libelle,niveau,parent_id,ordre,chemin_mat')
          .eq('lot', ing.lot).eq('libelle', lib).limit(1);
        noeud = ex && ex[0];
        if (!noeud) throw new Error('Nœud existant introuvable.');
      }
      setArbre((a) => (a.some((n) => n.id === noeud.id) ? a : [...a, noeud]));
      const ci = creer.i;
      setFrags((fr) => fr.map((f, k) => (k === ci ? { ...f, chapitre_ref_id: noeud.id } : f)));
      setCreer(null);
    } catch (e) { setErr('Création nœud : ' + (e.message || e)); }
    finally { setBusy(false); }
  };

  // Enregistre les corrections SANS capitaliser (on fiabilise tagging + alignement d'abord).
  const enregistrer = async () => {
    setBusy(true); setErr(null); setMsg(null);
    try {
      await client.from('ingestions').update({ fragments_json: frags, updated_at: new Date().toISOString() }).eq('id', ingestionId);
      setMsg('Corrections enregistrées.');
    } catch (e) { setErr('Erreur : ' + (e.message || e)); }
    finally { setBusy(false); }
  };

  // Enregistre puis lance la capitalisation async. Garde-fou SOFT : seul « 0 retenu »
  // bloque ; les non-alignés partent en « à aligner » (réglables plus tard).
  const capitaliser = async () => {
    if (nbGardes === 0) { setErr('Aucun fragment retenu : cochez au moins un fragment.'); return; }
    setBusy(true); setErr(null); setMsg(null);
    try {
      await client.from('ingestions').update({ fragments_json: frags, updated_at: new Date().toISOString() }).eq('id', ingestionId);
      await client.from('generation_jobs').insert({
        projet_id: null, type: 'ingestion_capitalisation', statut: 'en_attente',
        total_sections: nbGardes, payload_json: { ingestion_id: ingestionId }
      });
      await pousserWorker(client);
      onRetour();
    } catch (e) { setErr('Erreur : ' + (e.message || e)); setBusy(false); }
  };

  if (ing === null) return <div className="max-w-4xl mx-auto px-4 py-8 text-sm text-slate-400">Chargement…</div>;
  if (ing === false) return <CentreMessage titre="Ingestion introuvable" />;

  const tonsConfiance = { haute: 'ok', moyenne: 'neutre', faible: 'cours' };

  // Anatomie d'une carte nœud : indentée par PROFONDEUR RÉELLE (chaîne parent_nid) ;
  // zone ARBORESCENCE (titre/ordre + alignement) puis zone SIGNETS MÉTIER (§14.2).
  const renderCarte = ({ f, i, depth }) => {
    const exclu = f.garder === false;
    const faible = f.confiance === 'faible';
    const aAligner = !f.chapitre_ref_id;
    const noeud = f.chapitre_ref_id ? noeudParId.get(f.chapitre_ref_id) : null;
    const excluProb = exclu && exclusionProb.has(f.nid);   // exclu AVEC enfants retenus
    const hasKids = aEnfants.has(f.nid), replie = !!plies[f.nid];
    // Fil d'Ariane COMPLET : ancêtres (parent_nid) avec NUMÉRO + TITRE.
    const anc = []; let p = (f.parent_nid != null) ? idxByNid.get(f.parent_nid) : undefined, garde = 0;
    while (p !== undefined && garde++ < 50) {
      const pf = frags[p];
      anc.unshift((pf.ordre_chapitre ? pf.ordre_chapitre + ' ' : '') + (pf.titre || pf.ordre_chapitre || '(sans titre)'));
      p = (pf.parent_nid != null) ? idxByNid.get(pf.parent_nid) : undefined;
    }
    const fil = anc.join('  ›  ');
    // Voisins document (par nid) : ciblés « à aligner »/hors-arbo, sinon toggle.
    const orphelin = aAligner || (f.parent_nid == null && !f.ordre_chapitre);
    const montrerVoisins = orphelin || voisins[f.nid];
    const prev = idxByNid.get(f.nid - 1), next = idxByNid.get(f.nid + 1);
    const libVoisin = (j) => { const v = frags[j]; return (v.ordre_chapitre ? v.ordre_chapitre + ' ' : '') + (v.titre || (v.contenu || '').slice(0, 28) || '?'); };
    // « Aligner comme le parent » : plus proche ancêtre DÉJÀ aligné.
    const refParent = aAligner ? ancetreAligne(f) : null;
    const libParent = refParent ? (noeudParId.get(refParent) || {}).libelle : null;
    return (
      <div key={i} id={'frag-' + f.nid} style={{ marginLeft: depth * 16 }}>
        <div className={depth > 0 ? 'border-l-2 border-slate-200 pl-3' : ''}>
          <Carte className={'p-4 ' + (exclu ? 'opacity-60 ' : '') + (excluProb ? 'border-amber-400 ' : (aAligner && !exclu ? 'border-amber-300 ' : ''))}>
            {fil
              ? <p className="text-[11px] text-slate-500 mb-1.5">🗂 {fil}</p>
              : <p className="text-[11px] text-slate-400 mb-1.5">🗂 (racine{f.ordre_chapitre ? '' : ' · hors arborescence'})</p>}
            <div className="flex items-center justify-between gap-2 mb-2">
              <div className="flex flex-wrap items-center gap-2">
                {hasKids
                  ? <button onClick={() => toggle(f.nid)} className="w-4 text-slate-400 hover:text-slate-700">{replie ? '▸' : '▾'}</button>
                  : <span className="w-4 text-center text-slate-300">·</span>}
                {f.ordre_chapitre && <span className="text-xs font-mono text-slate-500">{f.ordre_chapitre}</span>}
                <span className="text-sm font-medium text-slate-700">{f.titre || <em className="text-slate-400">(sans titre)</em>}</span>
                <Badge>niv {depth + 1}</Badge>
                {hasKids && replie && <span className="text-[11px] text-slate-400">(replié)</span>}
                {aAligner && !exclu && <Badge ton="cours">à aligner</Badge>}
                <Badge ton={tonsConfiance[f.confiance] || 'neutre'}>confiance {f.confiance}</Badge>
                {faible && !exclu && <span className="text-xs text-amber-700">à vérifier</span>}
              </div>
              <label className="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer shrink-0">
                <input type="checkbox" checked={f.garder !== false} onChange={(e) => majFrag(i, 'garder', e.target.checked)} />
                retenir
              </label>
            </div>
            {excluProb && (
              <p className="text-[11px] text-amber-700 mb-2">
                ⚠ exclu mais des enfants sont retenus — ils seront <strong>re-rattachés au plus proche ancêtre retenu</strong> à la capitalisation.
              </p>
            )}
            {montrerVoisins && (prev !== undefined || next !== undefined) && (
              <p className="text-[11px] text-slate-500 mb-2 bg-slate-50 rounded px-2 py-1">
                ↕ voisins :{prev !== undefined && <span className="ml-1">↑ {libVoisin(prev)}</span>}{next !== undefined && <span className="ml-3">↓ {libVoisin(next)}</span>}
              </p>
            )}
            {!orphelin && (
              <button onClick={() => setVoisins((v) => ({ ...v, [f.nid]: !v[f.nid] }))}
                className="text-[11px] text-slate-400 hover:text-slate-600 mb-2 block">{voisins[f.nid] ? '− voisins' : '+ voisins'}</button>
            )}

        {/* ZONE ARBORESCENCE — identité source + alignement canonique */}
        <div className="rounded-lg border border-slate-200 bg-slate-50/60 p-3">
          <p className="text-[11px] uppercase tracking-wide text-slate-400 mb-2">🗂 Arborescence</p>
          <div className="grid sm:grid-cols-2 gap-2 mb-2">
            <FieldMini label="Titre" value={f.titre} onChange={(v) => majFrag(i, 'titre', v || null)} placeholder="titre du chapitre" />
            <FieldMini label="Ordre" value={f.ordre_chapitre} onChange={(v) => majFrag(i, 'ordre_chapitre', v || null)} placeholder="ex. 1.6" />
          </div>
          <ChapitreRefSelect value={f.chapitre_ref_id || ''} noeud={noeud} options={arbreOrdonne}
            onPick={(id) => majFrag(i, 'chapitre_ref_id', id)}
            onCreer={() => setCreer({ i, libelle: f.titre || '', parentId: '' })} />
          {refParent && (
            <button onClick={() => majFrag(i, 'chapitre_ref_id', refParent)}
              className="mt-1.5 text-xs text-brand-600 hover:underline">↪ aligner comme le parent (« {libParent || 'aligné'} »)</button>
          )}
          {creer && creer.i === i && (
            <div className="mt-2 p-3 rounded-lg border border-slate-300 bg-white flex flex-wrap items-end gap-2">
              <div className="flex-1 min-w-[160px]">
                <label className="block text-[11px] uppercase tracking-wide text-slate-400 mb-0.5">Nouveau nœud</label>
                <input className="w-full border rounded px-2 py-1 text-sm" value={creer.libelle} autoFocus
                  onChange={(e) => setCreer({ ...creer, libelle: e.target.value })} placeholder="ex. Régulation" />
              </div>
              <div className="min-w-[160px]">
                <label className="block text-[11px] uppercase tracking-wide text-slate-400 mb-0.5">Sous</label>
                <select className="w-full border rounded px-2 py-1 text-sm bg-white" value={creer.parentId}
                  onChange={(e) => setCreer({ ...creer, parentId: e.target.value })}>
                  <option value="">(racine)</option>
                  {arbreOrdonne.map((n) => <option key={n.id} value={n.id}>{'  '.repeat((n.niveau || 1) - 1) + n.libelle}</option>)}
                </select>
              </div>
              <button onClick={creerNoeud} disabled={busy}
                className="px-3 py-1.5 rounded-md bg-brand-600 text-white text-sm hover:bg-brand-700 disabled:opacity-50">Créer &amp; aligner</button>
              <button onClick={() => setCreer(null)} disabled={busy}
                className="px-3 py-1.5 rounded-md border border-slate-300 text-sm text-slate-600">Annuler</button>
            </div>
          )}
        </div>

        {/* ZONE SIGNETS MÉTIER — axe transversal, distinct de l'arborescence (§14.2) */}
        <div className="rounded-lg border border-slate-200 bg-white p-3 mt-2">
          <MetierTags valeurs={toArr(f.metier_sous_lot)} options={metiers}
            onChange={(arr) => majFrag(i, 'metier_sous_lot', arr)} />
        </div>

        <textarea
          className="w-full border rounded-lg px-3 py-2 text-sm text-slate-700 font-sans mt-2"
          rows={Math.min(8, Math.max(2, Math.ceil((f.contenu || '').length / 90)))}
          value={f.contenu} onChange={(e) => majFrag(i, 'contenu', e.target.value)} />

        <div className="grid sm:grid-cols-2 gap-2 mt-2">
          <SelectMini label="Typologie" value={f.typologie || ''} onChange={(v) => majFrag(i, 'typologie', v || null)}
            options={[{ v: '', l: '—' }, ...TYPOLOGIES]} />
          <FieldMini label="Type de local" value={f.type_local} onChange={(v) => majFrag(i, 'type_local', v)} placeholder="ex. locaux humides" />
        </div>
          </Carte>
        </div>
      </div>
    );
  };

  return (
    <div className="max-w-4xl mx-auto px-4 py-8">
      <button onClick={onRetour} className="text-sm text-slate-500 hover:underline mb-4">← Mine d'or</button>

      <div className="flex flex-wrap items-start justify-between gap-3 mb-1">
        <div>
          <h1 className="text-2xl font-bold text-slate-800">{ing.source_cctp}</h1>
          <p className="text-sm text-slate-500">
            {frags.length} fragment(s) · {nbGardes} retenu(s) · <span className={nbAAligner ? 'text-amber-700' : ''}>{nbAAligner} à aligner</span> · lot {ing.lot}
          </p>
        </div>
        <Badge ton="marque">Validation avant capitalisation</Badge>
      </div>

      {/* Barre d'action : garde-fou SOFT (le compteur « à aligner » n'empêche pas). */}
      <Carte className="p-4 my-4 sticky top-2 z-10">
        <div className="flex flex-wrap items-center justify-between gap-3">
          <p className="text-sm text-slate-600">
            Alignez l'<strong>arborescence</strong> + les <strong>signets métier</strong>, puis <strong>enregistrez</strong>.
          </p>
          <div className="flex items-center gap-2">
            <button onClick={enregistrer} disabled={busy}
              className="px-3 py-2 rounded-lg border border-slate-300 text-sm text-slate-700 hover:bg-slate-50 disabled:opacity-50">
              {busy ? '…' : '💾 Enregistrer'}
            </button>
            <Bouton onClick={capitaliser} disabled={busy || nbGardes === 0}>
              {busy ? 'Capitalisation…' : `✓ Valider & capitaliser (${nbGardes})`}
            </Bouton>
          </div>
        </div>
        {/* Aide à la navigation : aller au prochain/précédent « à aligner » (déplie + défile). */}
        {aTraiter.length > 0 ? (
          <div className="flex flex-wrap items-center gap-2 mt-2 pt-2 border-t border-slate-100">
            <span className="text-xs text-amber-700">
              <strong>{((posAligner % aTraiter.length + aTraiter.length) % aTraiter.length) + 1}/{aTraiter.length}</strong> à aligner
            </span>
            <button onClick={() => naviguer(-1)}
              className="px-2.5 py-1 rounded-md border border-slate-300 text-xs text-slate-700 hover:bg-slate-50">⤒ précédent</button>
            <button onClick={() => naviguer(1)}
              className="px-2.5 py-1 rounded-md border border-amber-300 bg-amber-50 text-xs text-amber-800 hover:bg-amber-100">⤓ prochain à traiter</button>
            <span className="text-[11px] text-slate-400">déplie le groupe + défile · non bloquant</span>
          </div>
        ) : (
          <p className="text-xs text-green-700 mt-2">✓ tout est aligné.</p>
        )}
      </Carte>

      {err && <p className="text-sm text-red-600 mb-3">{err}</p>}
      {msg && <p className="text-sm text-green-700 mb-3">{msg}</p>}

      {/* Arbre source réel (nid/parent_nid) : groupes pliables par racine, emboîtés par profondeur. */}
      <div className="space-y-3">
        {groupes.map((g) => {
          const plie = plies[g.key];
          return (
            <div key={g.key} className="rounded-xl border border-slate-200 overflow-hidden">
              <button onClick={() => toggle(g.key)}
                className="w-full flex items-center justify-between gap-2 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-left">
                <span className="text-sm font-semibold text-slate-700">
                  {plie ? '▸' : '▾'} {g.num ? g.num + ' · ' : ''}{g.titre}
                </span>
                <span className="text-xs text-slate-500">{g.total} nœud(s)</span>
              </button>
              {!plie && <div className="p-3 space-y-2 bg-white">{g.items.map(renderCarte)}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

      <input className="w-full border rounded px-2 py-1 text-sm" placeholder={placeholder || ''}
        value={value || ''} onChange={(e) => onChange(e.target.value)} />
    </div>

}

function SelectMini({ label, value, onChange, options }) {
  return (
    <div>
      <label className="block text-[11px] uppercase tracking-wide text-slate-400 mb-0.5">{label}</label>
      <select className="w-full border rounded px-2 py-1 text-sm bg-white"
        value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
      </select>

}

// Select d'ALIGNEMENT CANONIQUE : « à aligner » (null) + arbre chapitres_ref du lot
// (indenté par niveau), et une entrée pour créer un nœud. Bordure verte si aligné,
// ambre si « à aligner ». `value` = id du nœud ; `noeud` = nœud sélectionné (affichage).
function ChapitreRefSelect({ value, noeud, options, onPick, onCreer }) {
  const aligne = !!value;
  return (
    <div>
      <label className="block text-[11px] uppercase tracking-wide text-slate-400 mb-0.5">Alignement canonique</label>
      <select
        className={'w-full border rounded px-2 py-1.5 text-sm bg-white ' + (aligne ? 'border-green-400 text-slate-700' : 'border-amber-400 text-amber-700')}
        value={value || ''}
        onChange={(e) => {
          const v = e.target.value;
          if (v === '__creer__') { onCreer(); return; }
          onPick(v || null);
        }}>
        <option value="">— à aligner —</option>
        {/* nœud sélectionné mais absent de la liste (autre lot/inactif) : on le garde visible */}
        {value && !options.some((n) => n.id === value) && <option value={value}>{(noeud && noeud.libelle) || '(nœud)'}</option>}
        {options.map((n) => (
          <option key={n.id} value={n.id}>
            {'   '.repeat((n.niveau || 1) - 1) + ((n.niveau || 1) > 1 ? '↳ ' : '') + n.libelle}
          </option>
        ))}
        <option value="__creer__">➕ Créer un nœud…</option>
      </select>
    </div>
  );
}

// Édition MULTI-valeurs du SIGNET MÉTIER (§14.2) : badges supprimables + ajout
// depuis le référentiel `metiers` du lot (pick-only : pas de texte 100 % libre).
function MetierTags({ valeurs, options, onChange }) {
  const restantes = options.filter((o) => !valeurs.includes(o));
  return (
    <div>
      <label className="block text-[11px] uppercase tracking-wide text-slate-400 mb-0.5">🏷 Signets métier (multi)</label>
      <div className="flex flex-wrap items-center gap-1.5">
        {valeurs.length === 0 && <span className="text-xs text-slate-400">aucun</span>}
        {valeurs.map((v) => (
          <span key={v} className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-slate-100 text-xs text-slate-700">
            {v}
            <button type="button" className="text-slate-400 hover:text-red-600"
              onClick={() => onChange(valeurs.filter((x) => x !== v))}>×</button>
          </span>
        ))}
        {restantes.length > 0 && (
          <select className="border rounded px-2 py-1 text-xs bg-white" value=""
            onChange={(e) => { if (e.target.value) onChange([...valeurs, e.target.value]); }}>
            <option value="">+ ajouter…</option>
            {restantes.map((o) => <option key={o} value={o}>{o}</option>)}
          </select>
        )}
      </div>
    </div>
  );
}

function ListeIngestions({ client, onRelire, onDeposer }) {
  const [items, setItems] = useState(null);
  const [confirmId, setConfirmId] = useState(null);   // ingestion en attente de confirmation de suppression
  const [busyId, setBusyId] = useState(null);         // suppression en cours
  const [erreurSuppr, setErreurSuppr] = useState(null);
  const dernierPush = useRef(0);   // throttle du « nudge » worker (≤ 1 / 30 s)

  const charger = useCallback(async () => {
    const { data } = await client.from('ingestions').select('*')
      .order('created_at', { ascending: false }).limit(50);
    setItems(data || []);

    // Reprise rapide : si une analyse est en cours, on relance le worker (au plus
    // toutes les 30 s) — backstop si l'auto-enchaînement s'est interrompu, sans
    // attendre le cron quotidien.
    const enCours = (data || []).some((it) => it.statut === 'analyse');
    if (enCours && Date.now() - dernierPush.current > 30000) {
      dernierPush.current = Date.now();
      pousserWorker(client);
    }
  }, [client]);

  // Polling : les statuts évoluent au rythme du worker (analyse → a_valider → capitalisé).
  useEffect(() => {
    charger();
    const t = setInterval(charger, 4000);
    return () => clearInterval(t);
  }, [charger]);

  // Suppression d'une ingestion — STAGING UNIQUEMENT (admin). Nettoie : la ligne
  // `ingestions`, le(s) job(s) `generation_jobs` liés (via payload_json.ingestion_id)
  // et le fichier source dans le bucket `cctp_sources`. NE TOUCHE PAS aux fragments
  // déjà capitalisés (`fragments_cctp`) : la mine d'or validée est préservée.
  const supprimer = useCallback(async (it) => {
    setBusyId(it.id); setErreurSuppr(null);
    try {
      // 1) job(s) de staging liés (analyse + capitalisation), repérés par l'ingestion_id du payload.
      const { error: jErr } = await client.from('generation_jobs').delete()
        .filter('payload_json->>ingestion_id', 'eq', it.id);
      if (jErr) throw jErr;
      // 2) fichier source archivé dans le bucket (si présent).
      if (it.fichier_path) {
        const { error: sErr } = await client.storage.from('cctp_sources').remove([it.fichier_path]);
        if (sErr) throw sErr;
      }
      // 3) ligne de staging elle-même.
      const { error: iErr } = await client.from('ingestions').delete().eq('id', it.id);
      if (iErr) throw iErr;
      setConfirmId(null);
      await charger();
    } catch (e) {
      setErreurSuppr(`Suppression impossible : ${e.message || e}`);
    } finally {
      setBusyId(null);
    }
  }, [client, charger]);

  if (items === null) return <p className="text-sm text-slate-400">Chargement…</p>;
  if (items.length === 0) return (
    <Carte className="p-10 text-center">
      <p className="text-slate-600 font-medium">Aucun CCTP ingéré pour l'instant.</p>
      <p className="text-sm text-slate-400 mt-1 mb-5">Déposez un premier CCTP pour amorcer la mine d'or.</p>
      <Bouton onClick={onDeposer}>+ Déposer un CCTP</Bouton>
    </Carte>
  );

  return (
    <div className="space-y-2">
      {erreurSuppr && (
        <Carte className="p-3 border-red-200 bg-red-50 text-sm text-red-700">{erreurSuppr}</Carte>
      )}
      {items.map(it => {
        const cliquable = it.statut === 'a_valider';
        const enConfirm = confirmId === it.id;
        const enCours = busyId === it.id;
        return (
          <Carte key={it.id}
            className={'p-4 flex items-center justify-between gap-3 ' + (cliquable ? 'cursor-pointer hover:border-brand-300' : '')}
            >
            <button className="text-left flex-1 min-w-0" disabled={!cliquable}
              onClick={() => cliquable && onRelire(it.id)}>
              <p className="font-semibold text-slate-800">{it.source_cctp}</p>
              <p className="text-xs text-slate-400 mt-0.5">
                {libelle(TYPOLOGIES, it.typologie)} · lot {it.lot}
                {it.statut === 'capitalise' && ` · ${it.nb_capitalises} fragment(s)`}
                {it.statut === 'a_valider' && ` · ${(it.fragments_json || []).length} fragment(s) proposé(s) — cliquer pour relire`}
                {it.statut === 'erreur' && it.erreur && ` · ${it.erreur}`}
              </p>
            </button>
            <div className="flex items-center gap-2 shrink-0">
              <Badge ton={tonStatutIngestion[it.statut] || 'neutre'}>{libelleStatutIngestion[it.statut] || it.statut}</Badge>
              {enConfirm ? (
                <span className="flex items-center gap-1.5">
                  <span className="text-xs text-slate-500">Supprimer&nbsp;?</span>
                  <button disabled={enCours}
                    className="px-2 py-1 rounded-md bg-red-600 text-white text-xs font-medium hover:bg-red-700 disabled:opacity-50"
                    onClick={() => supprimer(it)}>{enCours ? '…' : 'Confirmer'}</button>
                  <button disabled={enCours}
                    className="px-2 py-1 rounded-md border border-slate-300 text-xs text-slate-600 hover:bg-slate-50 disabled:opacity-50"
                    onClick={() => setConfirmId(null)}>Annuler</button>
                </span>
              ) : (
                <button title="Supprimer cette ingestion (staging uniquement — ne touche pas aux fragments capitalisés)"
                  aria-label="Supprimer l'ingestion"
                  className="px-2 py-1 rounded-md text-slate-400 hover:text-red-600 hover:bg-red-50 text-sm"
                  onClick={() => { setErreurSuppr(null); setConfirmId(it.id); }}>🗑</button>
              )}
            </div>
          </Carte>
        );
      })}
    </div>
  );
}

// Explorateur léger de la mine d'or (VALIDATION #2 : vérifier le résultat).
// Explorateur de la mine d'or CAPITALISÉE (§15 étape 5) : navigation EN ARBRE par
// source (parent_id/chemin_mat), tri par seq, filtres métier + nœud canonique +
// focus sous-arbre, et recherche SÉMANTIQUE (embed front + match_fragments). Plus
// de limit 100, plus de chapitre_normalise (ancien modèle).
function ExplorateurFragments({ client }) {
  const [sources, setSources] = useState([]);        // ingestions capitalisées
  const [source, setSource] = useState('');
  const [lot, setLot] = useState('CVCP');
  const [noeuds, setNoeuds] = useState(null);        // null = chargement
  const [refs, setRefs] = useState([]);              // chapitres_ref du lot
  const [metiers, setMetiers] = useState([]);
  const [metierF, setMetierF] = useState('');
  const [chapRefF, setChapRefF] = useState('');
  const [focus, setFocus] = useState(null);          // { id, chemin_mat, titre } : sous-arbre source
  const [q, setQ] = useState('');
  const [mode, setMode] = useState('texte');         // 'texte' (filtre l'arbre) | 'semantique'
  const [resultats, setResultats] = useState(null);  // résultats sémantiques (mode semantique)
  const [plies, setPlies] = useState({});
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const toArr = (v) => (Array.isArray(v) ? v : (v ? [v] : []));
  const toggle = (id) => setPlies((p) => ({ ...p, [id]: !p[id] }));

  // 1) Sources = ingestions capitalisées (la mine d'or est une FORÊT de CCTP).
  useEffect(() => {
    (async () => {
      const { data } = await client.from('ingestions').select('source_cctp,lot')
        .eq('statut', 'capitalise').order('created_at', { ascending: false });
      const seen = new Set(), uniq = [];
      for (const r of (data || [])) if (r.source_cctp && !seen.has(r.source_cctp)) { seen.add(r.source_cctp); uniq.push(r); }
      setSources(uniq);
      if (uniq[0]) { setSource(uniq[0].source_cctp); setLot(uniq[0].lot || 'CVCP'); }
    })();
  }, [client]);

  // 2) Au changement de source : TOUS les nœuds (pas de limit) + référentiels du lot.
  useEffect(() => {
    if (!source) return;
    (async () => {
      setNoeuds(null); setResultats(null); setFocus(null); setMetierF(''); setChapRefF(''); setPlies({});
      const { data: ns } = await client.from('fragments_cctp')
        .select('id,parent_id,type,titre,niveau,chemin_mat,ordre_chapitre,seq,metier_sous_lot,chapitre_ref_id,type_local,contenu,source_cctp')
        .eq('source_cctp', source).order('seq', { ascending: true });
      setNoeuds(ns || []);
      const { data: cr } = await client.from('chapitres_ref')
        .select('id,libelle,niveau,parent_id,ordre,chemin_mat').eq('actif', true).eq('lot', lot);
      setRefs(cr || []);
      const { data: me } = await client.from('metiers').select('libelle').eq('actif', true).eq('lot', lot);
      setMetiers((me || []).map((m) => m.libelle));
    })();
  }, [client, source, lot]);

  const refById = useMemo(() => new Map(refs.map((r) => [r.id, r])), [refs]);
  // Référentiel canonique dans l'ordre de l'arbre (options indentées du filtre).
  const refOrdonne = useMemo(() => {
    const enf = new Map();
    for (const n of refs) { const k = n.parent_id || ''; (enf.get(k) || enf.set(k, []).get(k)).push(n); }
    for (const l of enf.values()) l.sort((a, b) => (a.ordre - b.ordre) || a.libelle.localeCompare(b.libelle));
    const out = []; const walk = (k) => { for (const n of (enf.get(k) || [])) { out.push(n); walk(n.id); } }; walk(''); return out;
  }, [refs]);
  // Sous-arbre canonique sélectionné -> ensemble d'ids (alignements acceptés).
  const refSubtreeIds = useMemo(() => {
    if (!chapRefF) return null;
    const sel = refById.get(chapRefF); if (!sel) return null;
    return new Set(refs.filter((r) => (r.chemin_mat || '').startsWith(sel.chemin_mat)).map((r) => r.id));
  }, [chapRefF, refs, refById]);

  // 3) Arbre filtré (mode texte) : nœuds visibles = matches + leurs ANCÊTRES (contexte).
  const vue = useMemo(() => {
    const ns = noeuds || [];
    const idById = new Map(ns.map((n) => [n.id, n]));
    const aEnfants = new Set(ns.map((n) => n.parent_id).filter(Boolean));
    const ql = mode === 'texte' ? q.trim().toLowerCase() : '';
    const matchN = (n) => {
      if (focus && !(n.chemin_mat || '').startsWith(focus.chemin_mat)) return false;
      if (metierF && !toArr(n.metier_sous_lot).includes(metierF)) return false;
      if (refSubtreeIds && !(n.chapitre_ref_id && refSubtreeIds.has(n.chapitre_ref_id))) return false;
      if (ql && !((n.contenu || '').toLowerCase().includes(ql) || (n.titre || '').toLowerCase().includes(ql))) return false;
      return true;
    };
    const visibles = new Set(), estMatch = new Set();
    for (const n of ns) if (matchN(n)) {
      estMatch.add(n.id); visibles.add(n.id);
      let p = n.parent_id;
      while (p && idById.has(p)) { if (visibles.has(p)) break; visibles.add(p); p = idById.get(p).parent_id; }
    }
    const foldedCm = ns.filter((n) => plies[n.id]).map((n) => n.chemin_mat);
    const cacheFold = (n) => foldedCm.some((cm) => (n.chemin_mat || '').startsWith(cm) && n.chemin_mat !== cm);
    const affiches = ns.filter((n) => visibles.has(n.id) && !cacheFold(n))
      .map((n) => ({ n, depth: Math.max(0, (n.niveau || 1) - 1), match: estMatch.has(n.id), hasKids: aEnfants.has(n.id) }));
    return { affiches, nbMatch: estMatch.size, total: ns.length };
  }, [noeuds, q, mode, metierF, refSubtreeIds, focus, plies]);

  // Recherche SÉMANTIQUE : embed (fonction edge) -> match_fragments (filtres actifs).
  const lancerSemantique = async () => {
    const texte = q.trim();
    if (!texte) { setResultats(null); return; }
    setBusy(true); setErr(null);
    try {
      const { data: emb, error: e1 } = await client.functions.invoke('embeddings', { body: { input: texte } });
      if (e1) throw e1;
      const vec = emb && emb.embeddings && emb.embeddings[0];
      if (!vec) throw new Error('Embedding indisponible.');
      const { data, error: e2 } = await client.rpc('match_fragments', {
        query_embedding: vec, match_count: 40, f_lot: lot,
        f_metier: metierF || null, f_chapitre_ref: chapRefF || null,
        f_sous_arbre: !!chapRefF, f_noeud: focus ? focus.id : null
      });
      if (e2) throw e2;
      setResultats(data || []);
    } catch (e) { setErr('Recherche sémantique : ' + (e.message || e)); setResultats([]); }
    finally { setBusy(false); }
  };
  const changerMode = (m) => { setMode(m); if (m === 'texte') setResultats(null); };
  const onSearchKey = (e) => { if (e.key === 'Enter' && mode === 'semantique') lancerSemantique(); };

  const badgeMetier = (arr) => toArr(arr).map((m) => <Badge key={m}>{m}</Badge>);
  const badgeAlign = (id) => id
    ? <Badge ton="ok">{(refById.get(id) || {}).libelle || 'aligné'}</Badge>
    : <Badge ton="cours">non aligné</Badge>;

  const enMode = mode === 'semantique' && resultats !== null;

  return (
    <div>
      {/* Barre de filtres : source · métier · nœud canonique · recherche (texte/sémantique) */}
      <div className="flex flex-wrap items-center gap-2 mb-3">
        <select className="border rounded-lg px-3 py-2 text-sm bg-white" value={source}
          onChange={(e) => { const s = sources.find((x) => x.source_cctp === e.target.value); setSource(e.target.value); setLot((s && s.lot) || 'CVCP'); }}>
          {sources.length === 0 && <option value="">— aucune source capitalisée —</option>}
          {sources.map((s) => <option key={s.source_cctp} value={s.source_cctp}>{s.source_cctp}</option>)}
        </select>
        <select className="border rounded-lg px-3 py-2 text-sm bg-white" value={metierF} onChange={(e) => setMetierF(e.target.value)}>
          <option value="">Tous métiers</option>
          {metiers.map((m) => <option key={m} value={m}>{m}</option>)}
        </select>
        <select className="border rounded-lg px-3 py-2 text-sm bg-white max-w-[220px]" value={chapRefF} onChange={(e) => setChapRefF(e.target.value)}>
          <option value="">Tout l'arbre canonique</option>
          {refOrdonne.map((n) => <option key={n.id} value={n.id}>{'  '.repeat((n.niveau || 1) - 1) + n.libelle}</option>)}
        </select>
        <div className="flex items-center gap-1 flex-1 min-w-[220px]">
          <input className="border rounded-lg px-3 py-2 text-sm flex-1"
            placeholder={mode === 'texte' ? 'Filtrer dans l\'arbre…' : 'Recherche par sens (Entrée)…'}
            value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={onSearchKey} />
          {mode === 'semantique' && (
            <button onClick={lancerSemantique} disabled={busy}
              className="px-3 py-2 rounded-lg bg-brand-600 text-white text-sm hover:bg-brand-700 disabled:opacity-50">{busy ? '…' : '🔍'}</button>
          )}
        </div>
        <div className="inline-flex rounded-lg border border-slate-300 overflow-hidden text-sm">
          {[{ k: 'texte', l: 'Texte' }, { k: 'semantique', l: 'Sémantique' }].map((o) => (
            <button key={o.k} onClick={() => changerMode(o.k)}
              className={'px-3 py-2 ' + (mode === o.k ? 'bg-brand-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-50')}>{o.l}</button>
          ))}
        </div>
      </div>

      {focus && (
        <div className="mb-3">
          <span className="inline-flex items-center gap-1.5 px-2 py-1 rounded-full bg-brand-50 text-brand-700 text-xs">
            ⌖ sous-arbre : {focus.titre}
            <button className="hover:text-red-600" onClick={() => setFocus(null)}>✕</button>
          </span>
        </div>
      )}
      {err && <p className="text-sm text-red-600 mb-3">{err}</p>}

      {noeuds === null && <p className="text-sm text-slate-400">Chargement…</p>}

      {/* MODE SÉMANTIQUE : résultats rankés (plat, cross-source) */}
      {noeuds !== null && enMode && (
        <div className="space-y-2">
          <p className="text-xs text-slate-500 mb-1">{resultats.length} résultat(s) par similarité (mine d'or entière, lot {lot}).</p>
          {resultats.length === 0 && <p className="text-sm text-slate-400">Aucun résultat.</p>}
          {resultats.map((r) => (
            <Carte key={r.id} className="p-3">
              <div className="flex items-center gap-2 flex-wrap mb-1">
                <Badge ton="ok">{Math.round((r.similarite || 0) * 100)}%</Badge>
                {r.ordre_chapitre && <span className="text-xs font-mono text-slate-500">{r.ordre_chapitre}</span>}
                <span className="text-sm font-medium text-slate-700">{r.titre || <em className="text-slate-400">(sans titre)</em>}</span>
                <Badge ton={r.type === 'titre' ? 'neutre' : 'marque'}>{r.type}</Badge>
                {badgeMetier(r.metier_sous_lot)}
                {badgeAlign(r.chapitre_ref_id)}
              </div>
              {r.contenu && <p className="text-xs text-slate-600 whitespace-pre-wrap line-clamp-3">{r.contenu}</p>}
              <p className="text-[11px] text-slate-400 mt-1">source : {r.source_cctp}</p>
            </Carte>
          ))}
        </div>
      )}

      {/* MODE ARBRE : nœuds de la source, emboîtés par profondeur, filtrés (contexte gardé) */}
      {noeuds !== null && !enMode && (
        <div>
          <p className="text-xs text-slate-500 mb-2">{vue.nbMatch} / {vue.total} nœud(s){vue.nbMatch !== vue.total ? ' (filtré)' : ''}.</p>
          {vue.affiches.length === 0 && <p className="text-sm text-slate-400">Aucun nœud ne correspond.</p>}
          <div className="space-y-1.5">
            {vue.affiches.map(({ n, depth, match, hasKids }) => (
              <div key={n.id} style={{ marginLeft: depth * 18 }}
                className={'rounded-lg border p-3 ' + (match ? 'border-slate-200 bg-white' : 'border-slate-100 bg-slate-50/50 opacity-70')}>
                <div className="flex items-center gap-2 flex-wrap">
                  {hasKids
                    ? <button onClick={() => toggle(n.id)} className="w-4 text-slate-400 hover:text-slate-700">{plies[n.id] ? '▸' : '▾'}</button>
                    : <span className="w-4 text-slate-300 text-center">·</span>}
                  {n.ordre_chapitre && <span className="text-xs font-mono text-slate-500">{n.ordre_chapitre}</span>}
                  <span className="text-sm font-medium text-slate-700">{n.titre || <em className="text-slate-400">(sans titre)</em>}</span>
                  <Badge ton={n.type === 'titre' ? 'neutre' : 'marque'}>{n.type}</Badge>
                  <span className="text-[11px] text-slate-400">niv {n.niveau}</span>
                  {badgeMetier(n.metier_sous_lot)}
                  {badgeAlign(n.chapitre_ref_id)}
                  <button onClick={() => setFocus({ id: n.id, chemin_mat: n.chemin_mat, titre: n.titre || n.ordre_chapitre || 'nœud' })}
                    className="text-[11px] text-brand-600 hover:underline ml-auto">⌖ focus</button>
                </div>
                {n.contenu && n.type === 'contenu' && (
                  <p className="text-xs text-slate-600 whitespace-pre-wrap line-clamp-3 mt-1">{n.contenu}</p>
                )}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================================
// APPLICATION — navigation par état (accueil / nouveau-projet / projet)
// ============================================================================
function App() {
  const { client, erreur } = useSupabase();
  const [session, setSession] = useState(undefined); // undefined = en cours, null = déconnecté
  const [profil, setProfil] = useState(null);
  const [nav, setNav] = useState({ ecran: 'accueil', projet: null });

  useEffect(() => {
    if (!client) return;
    client.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = client.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, [client]);

  useEffect(() => {
    if (!client || !session) { setProfil(null); return; }
    client.from('profiles').select('*').eq('id', session.user.id).single()
      .then(({ data }) => setProfil(data));
  }, [client, session]);

  const accueil = () => setNav({ ecran: 'accueil', projet: null });

  if (erreur) return <CentreMessage titre="Erreur de configuration" texte={erreur} />;
  if (!client || session === undefined) return <CentreMessage titre="Chargement…" />;
  if (!session) return <Auth client={client} />;

  const estAdmin = profil && profil.role === 'admin';
  const versAdmin = () => setNav({ ecran: 'admin' });

  return (
    <div className="min-h-screen">
      <EnTete session={session} profil={profil} client={client}
        onAccueil={accueil} onAdmin={versAdmin} />

      {nav.ecran === 'accueil' && (
        <EcranAccueil client={client}
          onNouveau={() => setNav({ ecran: 'nouveau-projet' })}
          onOuvrir={(p) => setNav({ ecran: 'projet', projet: p })} />
      )}
      {nav.ecran === 'nouveau-projet' && (
        <EcranNouveauProjet client={client} user={session.user}
          onCree={(p) => setNav({ ecran: 'projet', projet: p })}
          onAnnuler={accueil} />
      )}
      {nav.ecran === 'projet' && nav.projet && (
        <EcranProjet client={client} projet={nav.projet} onRetour={accueil} />
      )}

      {/* --- Écrans ADMIN (gardés par le rôle : inaccessibles sinon) --- */}
      {nav.ecran === 'admin' && estAdmin && (
        <EcranAdminMineOr client={client}
          onDeposer={() => setNav({ ecran: 'admin-depot' })}
          onRelire={(id) => setNav({ ecran: 'admin-relecture', ingestionId: id })} />
      )}
      {nav.ecran === 'admin-depot' && estAdmin && (
        <EcranDepotCCTP client={client} user={session.user}
          onAnnuler={versAdmin} onDepose={versAdmin} />
      )}
      {nav.ecran === 'admin-relecture' && estAdmin && nav.ingestionId && (
        <EcranRelectureIngestion client={client} ingestionId={nav.ingestionId} onRetour={versAdmin} />
      )}
      {nav.ecran && nav.ecran.startsWith('admin') && !estAdmin && (
        <CentreMessage titre="Accès réservé" texte="Cette section est réservée aux administrateurs." />
      )}

      <p className="max-w-5xl mx-auto px-4 pb-8 text-xs text-slate-400">
        Interface navigable (écrans réels, données Supabase). Le moteur IA — architecture,
        entonnoir, génération, export — est branché au bloc B.
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
