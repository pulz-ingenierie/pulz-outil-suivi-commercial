<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outil CCTP — PULZ</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // ==========================================================================
  // CONFIGURATION DE MARQUE (WHITE-LABEL) — cf. CADRAGE §11
  // --------------------------------------------------------------------------
  // Point UNIQUE de centralisation de l'esthétique : nom de l'outil, logo,
  // palette de couleurs. À terme, en multi-tenant, cet objet sera CHARGÉ DEPUIS
  // LA BASE par client (configuration de marque) — d'où la centralisation ici.
  // RÈGLE : aucune couleur de marque ni logo codés « en dur » ailleurs dans
  // l'application ; tout passe par window.THEME et la palette Tailwind `brand`.
  // L'esthétique PULZ fine sera cadrée plus tard ; on reste sobre pour l'instant.
  // ==========================================================================
  window.THEME = {
    nomOutil: 'Outil CCTP',
    marque: 'PULZ',
    logoUrl: null, // null → monogramme généré à partir de la marque
    // Échelle de couleur « brand » (vert sobre par défaut). Exposée à Tailwind
    // ci-dessous → utilisable via les classes bg-brand-600, text-brand-700, etc.
    palette: {
      50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7',
      400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857',
      800: '#065f46', 900: '#064e3b'
    }
  };
  tailwind.config = { theme: { extend: { colors: { brand: window.THEME.palette } } } };
</script>

<!-- React 18 + Babel (JSX compilé dans le navigateur), pattern pulz-outil-ao -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel ÉPINGLÉ en 7.x : le preset React y compile le JSX en runtime « classic »
     (React.createElement, via le React UMD global ci-dessus). Sans épinglage, le
     CDN sert la dernière version (8.x) dont le runtime par défaut « automatic »
     injecte `import { jsx } from "react/jsx-runtime"` -> écran blanc + erreur
     « Cannot use import statement outside a module ». NE PAS dépingler. -->
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

<!-- Client Supabase (UMD) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- mammoth.js : extraction du texte des .docx côté navigateur (cf. ingestion) -->
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<div id="root" class="min-h-screen"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// Configuration de marque centralisée (cf. <head>). JAMAIS de couleur/logo en
// dur dans les composants : on lit THEME et on utilise les classes `brand-*`.
const THEME = window.THEME;

// --- Référentiels métier (alignés sur les CHECK du schéma Supabase) ----------
// Un seul lot développé en v1 (cf. CADRAGE §2.5).
const LOTS = [{ v: 'CVCP', l: 'CVCP — Chauffage Ventilation Climatisation Plomberie' }];
const TYPOLOGIES = [
  { v: 'tertiaire', l: 'Tertiaire' },
  { v: 'logement', l: 'Logement' },
  { v: 'industrie', l: 'Industrie' }
];
const MODES = [
  { v: 'par_systeme', l: 'Par système' },
  { v: 'par_espace', l: 'Par espace' }
];
const PHASES = [
  { v: 'APS', l: 'APS' },
  { v: 'APD', l: 'APD' },
  { v: 'DCE', l: 'DCE' }
];
const libelle = (liste, v) => (liste.find(o => o.v === v) || {}).l || v || '—';

// --- Connexion Supabase (config publique récupérée depuis /api/config) -------
function useSupabase() {
  const [client, setClient] = useState(null);
  const [erreur, setErreur] = useState(null);
  useEffect(() => {
    (async () => {
      try {
        const r = await fetch('/api/config');
        const cfg = await r.json();
        if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
          setErreur('Config Supabase absente (variables d\'env Vercel non renseignées).');
          return;
        }
        setClient(window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey));
      } catch (e) {
        setErreur('Impossible de charger /api/config : ' + (e.message || e));
      }
    })();
  }, []);
  return { client, erreur };
}

// ============================================================================
// BRIQUES D'INTERFACE RÉUTILISABLES (stylées via la marque `brand`)
// ============================================================================

// Logo de marque : image si THEME.logoUrl, sinon monogramme généré.
function Logo({ taille = 'md' }) {
  const dim = taille === 'lg' ? 'h-10 w-10 text-base' : 'h-8 w-8 text-sm';
  const initiales = (THEME.marque || THEME.nomOutil || '?').slice(0, 2).toUpperCase();
  if (THEME.logoUrl) {
    return <img src={THEME.logoUrl} alt={THEME.marque} className={dim + ' rounded-lg object-contain'} />;
  }
  return (
    <div className={dim + ' rounded-lg bg-brand-600 text-white font-bold flex items-center justify-center'}>
      {initiales}
    </div>
  );
}

function Badge({ children, ton = 'neutre' }) {
  const tons = {
    neutre: 'bg-slate-100 text-slate-600',
    marque: 'bg-brand-50 text-brand-700',
    attente: 'bg-slate-100 text-slate-600',
    cours: 'bg-amber-100 text-amber-700',
    ok: 'bg-brand-100 text-brand-800',
    erreur: 'bg-red-100 text-red-700'
  };
  return <span className={'px-2 py-0.5 rounded text-xs font-medium ' + (tons[ton] || tons.neutre)}>{children}</span>;
}

function Bouton({ children, onClick, variant = 'primary', type = 'button', disabled, className = '' }) {
  const styles = {
    primary: 'bg-brand-600 hover:bg-brand-700 text-white',
    secondaire: 'border border-slate-300 text-slate-700 hover:bg-slate-50',
    ghost: 'text-slate-500 hover:text-slate-700 hover:underline'
  };
  const base = variant === 'ghost'
    ? 'text-sm '
    : 'text-sm rounded px-3.5 py-2 font-medium disabled:opacity-50 transition-colors ';
  return (
    <button type={type} onClick={onClick} disabled={disabled}
      className={base + (styles[variant] || styles.primary) + ' ' + className}>
      {children}
    </button>
  );
}

function Carte({ children, className = '', ...rest }) {
  return <div className={'bg-white rounded-xl shadow-sm border border-slate-200 ' + className} {...rest}>{children}</div>;
}

function CentreMessage({ titre, texte }) {
  return (
    <div className="flex items-center justify-center min-h-screen">
      <div className="text-center">
        <p className="text-lg font-semibold text-slate-700">{titre}</p>
        {texte && <p className="text-sm text-slate-500 mt-2 max-w-md">{texte}</p>}
      </div>
    </div>
  );
}

// ============================================================================
// AUTHENTIFICATION (logique inchangée — restylée marque)
// ============================================================================
function Auth({ client }) {
  const [email, setEmail] = useState('');
  const [mdp, setMdp] = useState('');
  const [mode, setMode] = useState('connexion');
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  const soumettre = async () => {
    setBusy(true); setMsg(null);
    try {
      if (mode === 'connexion') {
        const { error } = await client.auth.signInWithPassword({ email, password: mdp });
        if (error) throw error;
      } else {
        const { error } = await client.auth.signUp({ email, password: mdp });
        if (error) throw error;
        setMsg('Compte créé. Vérifie tes mails si la confirmation est activée, puis connecte-toi.');
        setMode('connexion');
      }
    } catch (e) {
      setMsg('Erreur : ' + (e.message || e));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="max-w-sm mx-auto mt-24">
      <div className="flex items-center gap-3 mb-6 justify-center">
        <Logo taille="lg" />
        <div>
          <h1 className="text-xl font-bold text-brand-700 leading-tight">{THEME.nomOutil}</h1>
          <p className="text-xs text-slate-500">{THEME.marque}</p>
        </div>
      </div>
      <Carte className="p-6">
        <input className="w-full border rounded px-3 py-2 mb-3 text-sm" placeholder="email"
          value={email} onChange={e => setEmail(e.target.value)} />
        <input className="w-full border rounded px-3 py-2 mb-4 text-sm" type="password" placeholder="mot de passe"
          value={mdp} onChange={e => setMdp(e.target.value)} />
        <Bouton onClick={soumettre} disabled={busy} className="w-full justify-center">
          {busy ? '…' : (mode === 'connexion' ? 'Se connecter' : 'Créer le compte')}
        </Bouton>
        <button onClick={() => setMode(mode === 'connexion' ? 'inscription' : 'connexion')}
          className="w-full text-xs text-slate-500 mt-3 hover:underline">
          {mode === 'connexion' ? 'Pas de compte ? Créer un compte' : 'Déjà un compte ? Se connecter'}
        </button>
        {msg && <p className="text-xs mt-4 text-slate-600">{msg}</p>}
      </Carte>
    </div>
  );
}

// ============================================================================
// EN-TÊTE APPLICATIF
// ============================================================================
function EnTete({ session, profil, onAccueil, onAdmin, client }) {
  const estAdmin = profil && profil.role === 'admin';
  return (
    <header className="bg-white border-b border-slate-200">
      <div className="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
        <button onClick={onAccueil} className="flex items-center gap-2.5">
          <Logo />
          <span className="font-semibold text-slate-800">{THEME.nomOutil}</span>
          <span className="text-xs text-slate-400">· {THEME.marque}</span>
        </button>
        <div className="flex items-center gap-3">
          {/* Entrée Administration : réservée au rôle admin (mine d'or, gabarits…). */}
          {estAdmin && (
            <Bouton variant="secondaire" onClick={onAdmin} className="hidden sm:inline-flex">Administration</Bouton>
          )}
          <span className="text-sm text-slate-500 hidden sm:inline">{session.user.email}</span>
          {profil && <Badge ton="marque">{profil.role}</Badge>}
          <Bouton variant="ghost" onClick={() => client.auth.signOut()}>Déconnexion</Bouton>
        </div>
      </div>
    </header>
  );
}

// ============================================================================
// ÉCRAN — ACCUEIL / LISTE DES PROJETS
// ============================================================================
function EcranAccueil({ client, onNouveau, onOuvrir }) {
  const [projets, setProjets] = useState(null); // null = chargement
  const [suppr, setSuppr] = useState(null);     // id du projet en cours de suppression
  const [err, setErr] = useState('');

  const charger = useCallback(async () => {
    const { data } = await client
      .from('projets')
      .select('*')
      .order('created_at', { ascending: false });
    setProjets(data || []);
  }, [client]);
  useEffect(() => { charger(); }, [charger]);

  // Suppression complète d'un projet, sans orphelin :
  //  1) fichiers du bucket 'pieces' (le cascade SQL ne touche PAS le storage) ;
  //  2) ligne projets -> la DB cascade les 10 tables + les fiches projet (FK cascade).
  const supprimerProjet = async (p) => {
    if (!window.confirm('Supprimer définitivement « ' + p.nom + ' » et TOUTES ses données (pièces, fichiers, entonnoir, contexte) ? Action irréversible.')) return;
    setSuppr(p.id); setErr('');
    try {
      const { data: objets } = await client.storage.from('pieces').list(p.id, { limit: 1000 });
      const chemins = (objets || []).map((o) => p.id + '/' + o.name);
      if (chemins.length) await client.storage.from('pieces').remove(chemins);
      const { error } = await client.from('projets').delete().eq('id', p.id);
      if (error) throw error;
      await charger();
    } catch (e) { setErr('Suppression : ' + (e.message || e)); }
    setSuppr(null);
  };

  return (
    <div className="max-w-5xl mx-auto px-4 py-8">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-2xl font-bold text-slate-800">Projets</h1>
          <p className="text-sm text-slate-500">Vos opérations en cours de rédaction CCTP.</p>
        </div>
        <Bouton onClick={onNouveau}>+ Nouveau projet</Bouton>
      </div>

      {projets === null && <p className="text-sm text-slate-400">Chargement…</p>}
      {err && <p className="text-sm text-red-600 mb-3">{err}</p>}

      {projets !== null && projets.length === 0 && (
        <Carte className="p-10 text-center">
          <p className="text-slate-600 font-medium">Aucun projet pour l'instant.</p>
          <p className="text-sm text-slate-400 mt-1 mb-5">Créez votre première opération pour démarrer.</p>
          <Bouton onClick={onNouveau}>+ Nouveau projet</Bouton>
        </Carte>
      )}

      {projets !== null && projets.length > 0 && (
        <div className="grid gap-3 sm:grid-cols-2">
          {projets.map(p => (
            <div key={p.id} className="relative">
              <div onClick={() => onOuvrir(p)} className="text-left cursor-pointer">
                <Carte className="p-4 hover:border-brand-300 hover:shadow transition-all h-full">
                  <h3 className="font-semibold text-slate-800 pr-8">{p.nom}</h3>
                  <div className="flex flex-wrap gap-1.5 mt-3">
                    <Badge ton="marque">{p.lot}</Badge>
                    <Badge>{libelle(TYPOLOGIES, p.typologie)}</Badge>
                    <Badge>{libelle(MODES, p.mode_organisation)}</Badge>
                    <Badge>{libelle(PHASES, p.phase)}</Badge>
                  </div>
                </Carte>
              </div>
              <button title="Supprimer le projet" disabled={suppr === p.id}
                onClick={(e) => { e.stopPropagation(); supprimerProjet(p); }}
                className="absolute top-2 right-2 p-1.5 rounded text-slate-300 hover:text-red-600 hover:bg-red-50 disabled:opacity-50 transition-colors">
                {suppr === p.id
                  ? <span className="text-xs">…</span>
                  : <svg viewBox="0 0 20 20" fill="currentColor" className="h-4 w-4"><path fillRule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd" /></svg>}
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ============================================================================
// ÉCRAN — CRÉATION DE PROJET (les 4 axes, cf. CADRAGE §2)
// ============================================================================
function ChoixAxe({ titre, options, valeur, onChange }) {
  return (
    <div>
      <label className="block text-sm font-medium text-slate-700 mb-1.5">{titre}</label>
      <div className="flex flex-wrap gap-2">
        {options.map(o => {
          const actif = valeur === o.v;
          return (
            <button key={o.v} type="button" onClick={() => onChange(o.v)}
              className={'text-sm rounded-lg px-3 py-1.5 border transition-colors ' +
                (actif
                  ? 'border-brand-600 bg-brand-50 text-brand-700 font-medium'
                  : 'border-slate-300 text-slate-600 hover:bg-slate-50')}>
              {o.l}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function EcranNouveauProjet({ client, user, onCree, onAnnuler }) {
  const [nom, setNom] = useState('');
  const [lot] = useState('CVCP'); // un seul lot en v1
  const [typologie, setTypologie] = useState('tertiaire');
  const [mode, setMode] = useState('par_systeme');
  const [phase, setPhase] = useState('APS');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const creer = async () => {
    if (!nom.trim()) { setErr('Donnez un nom au projet.'); return; }
    setBusy(true); setErr(null);
    const { data, error } = await client.from('projets').insert({
      nom: nom.trim(), lot, typologie, mode_organisation: mode, phase,
      cree_par: user.id
    }).select().single();
    setBusy(false);
    if (error) { setErr('Erreur : ' + error.message); return; }
    onCree(data);
  };

  return (
    <div className="max-w-2xl mx-auto px-4 py-8">
      <button onClick={onAnnuler} className="text-sm text-slate-500 hover:underline mb-4">← Retour aux projets</button>
      <h1 className="text-2xl font-bold text-slate-800 mb-1">Nouveau projet</h1>
      <p className="text-sm text-slate-500 mb-6">Quatre axes structurent la génération du CCTP (cf. cadrage).</p>

      <Carte className="p-6 space-y-6">
        <div>
          <label className="block text-sm font-medium text-slate-700 mb-1.5">Nom de l'opération</label>
          <input className="w-full border rounded-lg px-3 py-2 text-sm" placeholder="ex. Réhabilitation siège tertiaire — Lyon"
            value={nom} onChange={e => setNom(e.target.value)} />
        </div>

        <div>
          <label className="block text-sm font-medium text-slate-700 mb-1.5">Lot / corps d'état</label>
          <Badge ton="marque">{libelle(LOTS, lot)}</Badge>
          <p className="text-xs text-slate-400 mt-1.5">Seul le lot CVCP est développé en v1 (cf. cadrage §2.5).</p>
        </div>

        <ChoixAxe titre="Typologie de projet" options={TYPOLOGIES} valeur={typologie} onChange={setTypologie} />
        <ChoixAxe titre="Mode d'organisation" options={MODES} valeur={mode} onChange={setMode} />
        <ChoixAxe titre="Phase / niveau de détail" options={PHASES} valeur={phase} onChange={setPhase} />

        {err && <p className="text-sm text-red-600">{err}</p>}

        <div className="flex gap-2 pt-2">
          <Bouton onClick={creer} disabled={busy}>{busy ? 'Création…' : 'Créer le projet'}</Bouton>
          <Bouton variant="secondaire" onClick={onAnnuler}>Annuler</Bouton>
        </div>
      </Carte>
    </div>
  );
}

// ============================================================================
// ÉCRAN — ESPACE PROJET (onglets)
// ============================================================================
const ONGLETS = [
  { k: 'pieces', l: 'Pièces' },
  { k: 'cadrage', l: 'Cadrage' },
  { k: 'contexte', l: 'Contexte' },
  { k: 'architecture', l: 'Architecture' },
  { k: 'generation', l: 'Génération' },
  { k: 'livrables', l: 'Livrables' }
];

function EcranProjet({ client, projet, onRetour }) {
  const [onglet, setOnglet] = useState('pieces');
  // Signal « périmé » : du matériel (pièce/réponse) plus récent que la dernière
  // synthèse / le dernier tour. Calculé ici (pour les pastilles d'onglet), passé
  // aux onglets pour leurs bandeaux. L'humain déclenche la relance, jamais l'outil.
  const [perime, setPerime] = useState({ contexte: false, entonnoir: false, pieces: [], pointsRepondus: [] });

  const calcPerime = useCallback(async () => {
    const phase = projet.phase;
    const [rPc, rCtx, rTour, rRep, rPts] = await Promise.all([
      client.from('pieces_projet').select('nom_fichier,updated_at,statut_extraction').eq('projet_id', projet.id).in('statut_extraction', ['fait', 'differe']),
      client.from('contexte_projet').select('synthetise_a').eq('projet_id', projet.id).eq('phase', phase).maybeSingle(),
      client.from('entonnoir_tours').select('created_at').eq('projet_id', projet.id).eq('phase', phase).order('created_at', { ascending: false }).limit(1),
      client.from('reponses_entonnoir').select('created_at').eq('projet_id', projet.id).eq('phase', phase).eq('valide_humain', true),
      client.from('points_contexte').select('texte,updated_at').eq('projet_id', projet.id).eq('phase', phase).eq('statut', 'repondu')  // 3e source
    ]);
    const ms = (d) => (d ? new Date(d).getTime() : null);
    const synthA = rCtx.data && rCtx.data.synthetise_a ? ms(rCtx.data.synthetise_a) : null;
    const dernierTour = rTour.data && rTour.data[0] ? ms(rTour.data[0].created_at) : null;
    const piecesApresSynth = synthA ? (rPc.data || []).filter((p) => ms(p.updated_at) > synthA) : [];
    const repsApresSynth = synthA ? (rRep.data || []).filter((r) => ms(r.created_at) > synthA) : [];
    const ptsApresSynth = synthA ? (rPts.data || []).filter((p) => ms(p.updated_at) > synthA) : [];   // réponses à un point non intégrées
    const piecesApresTour = dernierTour ? (rPc.data || []).filter((p) => ms(p.updated_at) > dernierTour) : [];
    setPerime({
      // contexte : pièces + réponses entonnoir + réponses à un point (3 sources, 1 détecteur)
      contexte: synthA != null && (piecesApresSynth.length > 0 || repsApresSynth.length > 0 || ptsApresSynth.length > 0),
      entonnoir: dernierTour != null && piecesApresTour.length > 0,   // pièces seulement (choix : un point est du raffinement aval)
      pieces: piecesApresSynth.map((p) => p.nom_fichier),
      pointsRepondus: ptsApresSynth.map((p) => p.texte)
    });
  }, [client, projet.id, projet.phase]);
  useEffect(() => { calcPerime(); const t = setInterval(calcPerime, 4000); return () => clearInterval(t); }, [calcPerime]);

  // Chaînage entonnoir -> contexte (cf. §13.3) : déclenché par l'humain
  // (« Assez »), jamais en auto. Pose le job de synthèse et bascule sur Contexte.
  const lancerSynthese = useCallback(async () => {
    await client.from('generation_jobs').insert({
      projet_id: projet.id, type: 'contexte_synthese', statut: 'en_attente',
      payload_json: { projet_id: projet.id, phase: projet.phase }
    });
    await pousserWorker(client);
    setOnglet('contexte');
  }, [client, projet.id, projet.phase]);

  const pastille = {
    cadrage: perime.entonnoir || (perime.pointsRepondus || []).length > 0,   // entonnoir OU réponses non intégrées
    contexte: perime.contexte
  };

  return (
    <div className="max-w-5xl mx-auto px-4 py-8">
      <button onClick={onRetour} className="text-sm text-slate-500 hover:underline mb-4">← Tous les projets</button>
      <div className="flex flex-wrap items-center gap-2 mb-5">
        <h1 className="text-2xl font-bold text-slate-800 mr-1">{projet.nom}</h1>
        <Badge ton="marque">{projet.lot}</Badge>
        <Badge>{libelle(TYPOLOGIES, projet.typologie)}</Badge>
        <Badge>{libelle(MODES, projet.mode_organisation)}</Badge>
        <Badge>{libelle(PHASES, projet.phase)}</Badge>
      </div>

      <div className="border-b border-slate-200 flex gap-1 mb-6 overflow-x-auto">
        {ONGLETS.map(o => {
          const actif = onglet === o.k;
          return (
            <button key={o.k} onClick={() => setOnglet(o.k)}
              className={'px-4 py-2.5 text-sm font-medium border-b-2 -mb-px whitespace-nowrap transition-colors ' +
                (actif
                  ? 'border-brand-600 text-brand-700'
                  : 'border-transparent text-slate-500 hover:text-slate-700')}>
              {o.l}
              {pastille[o.k] && <span title="Du matériel récent n'est pas intégré" className="inline-block ml-1.5 h-2 w-2 rounded-full bg-amber-500 align-middle" />}
            </button>
          );
        })}
      </div>

      {onglet === 'pieces' && <OngletPieces client={client} projet={projet} />}
      {onglet === 'architecture' && (
        <PlaceholderOnglet titre="Architecture du CCTP"
          description="Arborescence des chapitres, proposée puis éditée librement."
          points={[
            'Proposition d\'arborescence par l\'IA (à partir du schéma directeur + intrants)',
            'Édition libre (drag & drop) — c\'est l\'arborescence validée qui pilote la génération'
          ]} />
      )}
      {onglet === 'cadrage' && <OngletCadrage client={client} projet={projet} onSynthese={lancerSynthese} perimeEntonnoir={perime.entonnoir} pointsRepondus={perime.pointsRepondus} onAllerContexte={() => setOnglet('contexte')} />}
      {onglet === 'contexte' && <OngletContexte client={client} projet={projet} perime={perime.contexte} nouvellesPieces={perime.pieces} pointsRepondus={perime.pointsRepondus} />}
      {onglet === 'generation' && <OngletGeneration client={client} projet={projet} />}
      {onglet === 'livrables' && (
        <PlaceholderOnglet titre="Livrables"
          description="CCTP produits, validés par chapitre, exportés au format marché."
          points={[
            'Relecture / validation chapitre par chapitre',
            'Export Word (.docx) via le gabarit administrable sélectionné',
            'Multilots : liste des CCTP du projet + fusion en document unique',
            'Capitalisation inter-phases (APS → APD → DCE)'
          ]} />
      )}
    </div>
  );
}

function PlaceholderOnglet({ titre, description, points }) {
  return (
    <Carte className="p-6">
      <div className="flex items-center gap-2 mb-1">
        <h2 className="font-semibold text-slate-800">{titre}</h2>
        <Badge>À venir — bloc B</Badge>
      </div>
      <p className="text-sm text-slate-500 mb-4">{description}</p>
      <ul className="space-y-1.5">
        {points.map((p, i) => (
          <li key={i} className="text-sm text-slate-600 flex gap-2">
            <span className="text-brand-500 mt-0.5">•</span><span>{p}</span>
          </li>
        ))}
      </ul>
    </Carte>
  );
}

// --- Onglet Génération : suivi asynchrone RÉEL (generation_jobs du projet) ----
// Réutilise le pipeline async déjà en place (worker à la demande). Les sections
// sont factices tant que l'IA n'est pas branchée (bloc B), mais le mécanisme
// — file, claim, progression, auto-enchaînement — est le vrai.
function OngletGeneration({ client, projet }) {
  const [jobs, setJobs] = useState([]);
  const [busy, setBusy] = useState(false);

  const charger = useCallback(async () => {
    const { data } = await client
      .from('generation_jobs')
      .select('*')
      .eq('projet_id', projet.id)
      .order('created_at', { ascending: false })
      .limit(20);
    setJobs(data || []);
  }, [client, projet.id]);

  // Polling toutes les 4 s (cf. CADRAGE §8.2).
  useEffect(() => {
    charger();
    const t = setInterval(charger, 4000);
    return () => clearInterval(t);
  }, [charger]);

  const lancerGeneration = async () => {
    setBusy(true);
    await client.from('generation_jobs').insert({
      projet_id: projet.id,
      type: 'test',
      statut: 'en_attente',
      total_sections: 3,
      payload_json: { note: 'génération de démonstration (sections factices)' }
    });
    // Déclenchement À LA DEMANDE : on « pousse » le worker avec le JWT user ;
    // il draine la file et s'auto-enchaîne ensuite (cf. api/worker.js).
    try {
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        await fetch('/api/worker', {
          method: 'POST',
          headers: { authorization: `Bearer ${session.access_token}` }
        });
      }
    } catch (_) { /* le cron quotidien reprendra au pire */ }
    await charger();
    setBusy(false);
  };

  const tonStatut = { en_attente: 'attente', en_cours: 'cours', termine: 'ok', erreur: 'erreur' };

  return (
    <Carte className="p-6">
      <div className="flex items-center justify-between mb-1">
        <div className="flex items-center gap-2">
          <h2 className="font-semibold text-slate-800">Génération asynchrone</h2>
          <Badge ton="marque">infra réelle</Badge>
        </div>
        <Bouton onClick={lancerGeneration} disabled={busy}>
          {busy ? '…' : 'Lancer une génération (test)'}
        </Bouton>
      </div>
      <p className="text-xs text-slate-500 mb-4">
        Le worker traite les sections en chaîne, indépendamment de l'onglet. Le statut passe
        <span className="font-mono"> en_attente → en_cours → termine</span> tout seul.
        Sections factices pour l'instant ; l'IA arrive au bloc B.
      </p>
      <div className="space-y-2">
        {jobs.length === 0 && <p className="text-sm text-slate-400">Aucune génération lancée sur ce projet.</p>}
        {jobs.map(j => (
          <div key={j.id} className="flex items-center justify-between border rounded-lg px-3 py-2 text-sm">
            <span className="font-mono text-xs text-slate-400">{j.id.slice(0, 8)}</span>
            <span className="text-slate-600">section {j.progression_section}/{j.total_sections}</span>
            <Badge ton={tonStatut[j.statut] || 'neutre'}>{j.statut}</Badge>
          </div>
        ))}
      </div>
    </Carte>
  );
}

// ============================================================================
// OUTIL COMMUN — pousser le worker (déclenchement à la demande, cf. api/worker.js)
// ============================================================================
async function pousserWorker(client) {
  try {
    const { data: { session } } = await client.auth.getSession();
    if (session) {
      await fetch('/api/worker', {
        method: 'POST',
        headers: { authorization: `Bearer ${session.access_token}` }
      });
    }
  } catch (_) { /* le cron quotidien reprendra au pire */ }
}

// ============================================================================
// ESPACE PROJET — FLUX ÉTAPE 1 : PIÈCES → ENTONNOIR → CONTEXTE (§13.3)
// Mêmes patterns que les écrans existants : client passé en prop, polling 4 s,
// jobs posés en file + pousserWorker, briques Bouton/Carte/Badge.
// ============================================================================
const CATEGORIES_PIECE = [
  { v: 'contexte', l: 'Contexte' },
  { v: 'fiches', l: 'Fiches techniques' },
  { v: 'plans', l: 'Plans / schémas' },
  { v: 'mails', l: 'Mails' }
];
const TON_EXTRACTION = { en_attente: 'attente', en_cours: 'cours', fait: 'ok', differe: 'marque', erreur: 'erreur' };

// --- Onglet PIÈCES : brief libre + upload (bucket 'pieces') + suivi extraction -
function OngletPieces({ client, projet }) {
  const [brief, setBrief] = useState(null);          // null = en cours de chargement
  const [briefMsg, setBriefMsg] = useState('');
  const [briefBusy, setBriefBusy] = useState(false);
  const [pieces, setPieces] = useState(null);
  const [cat, setCat] = useState('contexte');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [ouverts, setOuverts] = useState({});        // aperçus dépliés (par id)
  const [annots, setAnnots] = useState({});          // brouillons d'annotation (par id)
  const fileRef = useRef(null);

  // Brief chargé UNE fois (le polling ne doit pas écraser la saisie en cours).
  useEffect(() => {
    (async () => {
      const { data } = await client.from('brief').select('contenu').eq('projet_id', projet.id).maybeSingle();
      setBrief((data && data.contenu) || '');
    })();
  }, [client, projet.id]);

  const charger = useCallback(async () => {
    const { data } = await client.from('pieces_projet')
      .select('id,categorie,nom_fichier,mime,statut_extraction,mode_traitement,texte_extrait,vision_json,annotation_humaine,storage_path')
      .eq('projet_id', projet.id).order('created_at', { ascending: true });
    setPieces(data || []);
  }, [client, projet.id]);
  useEffect(() => { charger(); const t = setInterval(charger, 4000); return () => clearInterval(t); }, [charger]);

  const enregistrerBrief = async () => {
    setBriefBusy(true); setBriefMsg(''); setErr('');
    const { error } = await client.from('brief').upsert(
      { projet_id: projet.id, contenu: brief, updated_at: new Date().toISOString() }, { onConflict: 'projet_id' });
    setBriefBusy(false);
    if (error) setErr('Brief : ' + error.message); else setBriefMsg('Brief enregistré.');
  };

  const choisir = async (files) => {
    if (!files || !files.length) return;
    setBusy(true); setErr('');
    try {
      for (const f of Array.from(files)) {
        const ext = (f.name.split('.').pop() || 'bin').toLowerCase();
        const uid = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
        const chemin = projet.id + '/' + uid + '.' + ext;
        const up = await client.storage.from('pieces').upload(chemin, f, { contentType: f.type || undefined, upsert: false });
        if (up.error) throw up.error;
        const { data: piece, error: ie } = await client.from('pieces_projet').insert({
          projet_id: projet.id, categorie: cat, nom_fichier: f.name,
          storage_path: chemin, mime: f.type || null, statut_extraction: 'en_attente'
        }).select().single();
        if (ie) throw ie;
        await client.from('generation_jobs').insert({
          projet_id: projet.id, type: 'piece_extraction', statut: 'en_attente', payload_json: { piece_id: piece.id }
        });
      }
      await pousserWorker(client);
      await charger();
    } catch (e) { setErr('Chargement : ' + (e.message || e)); }
    setBusy(false);
    if (fileRef.current) fileRef.current.value = '';
  };

  const relancer = async (p) => {
    await client.from('pieces_projet').update({ statut_extraction: 'en_attente' }).eq('id', p.id);
    await client.from('generation_jobs').insert({ projet_id: projet.id, type: 'piece_extraction', statut: 'en_attente', payload_json: { piece_id: p.id } });
    await pousserWorker(client); await charger();
  };

  const enregistrerAnnotation = async (p) => {
    await client.from('pieces_projet').update({ annotation_humaine: annots[p.id] != null ? annots[p.id] : (p.annotation_humaine || '') }).eq('id', p.id);
    await charger();
  };

  const supprimer = async (p) => {
    if (!window.confirm('Supprimer « ' + p.nom_fichier + ' » ?')) return;
    if (p.storage_path) await client.storage.from('pieces').remove([p.storage_path]);
    await client.from('pieces_projet').delete().eq('id', p.id);
    await charger();
  };

  return (
    <div className="space-y-6">
      <Carte className="p-6">
        <h2 className="font-semibold text-slate-800 mb-1">Brief libre</h2>
        <p className="text-sm text-slate-500 mb-3">Topo écrit du projet — repris comme matériau de cadrage (entonnoir, contexte).</p>
        <textarea className="w-full border rounded-lg px-3 py-2 text-sm text-slate-700 font-sans"
          rows={5} value={brief || ''} placeholder="Décrivez le contexte du projet…"
          onChange={(e) => { setBrief(e.target.value); setBriefMsg(''); }} />
        <div className="flex items-center gap-3 mt-2">
          <Bouton onClick={enregistrerBrief} disabled={briefBusy || brief === null}>{briefBusy ? '…' : 'Enregistrer le brief'}</Bouton>
          {briefMsg && <span className="text-sm text-green-700">{briefMsg}</span>}
        </div>
      </Carte>

      <Carte className="p-6">
        <h2 className="font-semibold text-slate-800 mb-3">Charger des pièces</h2>
        <div className="flex flex-wrap items-center gap-3 mb-3">
          <label className="text-sm text-slate-600">Catégorie</label>
          <select className="border rounded-lg px-3 py-2 text-sm" value={cat} onChange={(e) => setCat(e.target.value)}>
            {CATEGORIES_PIECE.map((c) => <option key={c.v} value={c.v}>{c.l}</option>)}
          </select>
        </div>
        <label className="block border-2 border-dashed border-slate-300 rounded-xl p-6 text-center cursor-pointer hover:border-brand-400 transition-colors"
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => { e.preventDefault(); choisir(e.dataTransfer.files); }}>
          <input ref={fileRef} type="file" multiple className="hidden" onChange={(e) => choisir(e.target.files)} />
          <p className="text-slate-500 text-sm">{busy ? 'Chargement…' : 'Glissez un ou plusieurs fichiers ici, ou cliquez pour parcourir'}</p>
          <p className="text-xs text-slate-400 mt-1">L'extraction démarre automatiquement : texte (contexte/mails), vision (fiches), différé (plans).</p>
        </label>
        {err && <p className="text-sm text-red-600 mt-3">{err}</p>}
      </Carte>

      <div className="space-y-3">
        {pieces === null && <p className="text-sm text-slate-400">Chargement…</p>}
        {pieces && pieces.length === 0 && <p className="text-sm text-slate-400">Aucune pièce chargée.</p>}
        {pieces && pieces.map((p) => {
          const ouvert = ouverts[p.id];
          const valeurs = p.vision_json && p.vision_json.valeurs;
          return (
            <Carte key={p.id} className="p-4">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-sm font-medium text-slate-800">{p.nom_fichier}</span>
                <Badge>{libelle(CATEGORIES_PIECE, p.categorie)}</Badge>
                <Badge ton={TON_EXTRACTION[p.statut_extraction] || 'neutre'}>{p.statut_extraction}</Badge>
                <span className="flex-1" />
                {p.statut_extraction === 'fait' && (p.texte_extrait || valeurs) &&
                  <Bouton variant="ghost" onClick={() => setOuverts((o) => ({ ...o, [p.id]: !o[p.id] }))}>{ouvert ? 'Masquer' : 'Aperçu'}</Bouton>}
                {p.statut_extraction === 'erreur' &&
                  <Bouton variant="secondaire" onClick={() => relancer(p)}>Relancer</Bouton>}
                <Bouton variant="ghost" onClick={() => supprimer(p)}>Supprimer</Bouton>
              </div>

              {p.statut_extraction === 'erreur' &&
                <p className="text-sm text-red-600 mt-2">Échec de l'extraction (détail dans l'onglet Génération). Vous pouvez relancer.</p>}

              {p.statut_extraction === 'differe' && (
                <div className="mt-3">
                  <p className="text-xs text-slate-500 mb-1">Plan/schéma non interprété automatiquement — saisissez l'apport manuel :</p>
                  <textarea className="w-full border rounded-lg px-3 py-2 text-sm text-slate-700 font-sans"
                    rows={3} value={annots[p.id] != null ? annots[p.id] : (p.annotation_humaine || '')}
                    onChange={(e) => setAnnots((a) => ({ ...a, [p.id]: e.target.value }))} />
                  <div className="mt-2"><Bouton variant="secondaire" onClick={() => enregistrerAnnotation(p)}>Enregistrer l'annotation</Bouton></div>
                </div>
              )}

              {ouvert && (
                <div className="mt-3 space-y-3">
                  {p.texte_extrait &&
                    <pre className="whitespace-pre-wrap text-xs text-slate-600 bg-slate-50 rounded-lg p-3 max-h-60 overflow-auto font-sans">{p.texte_extrait}</pre>}
                  {valeurs && (
                    <div className="text-xs">
                      <p className="font-semibold text-slate-600 mb-1">Valeurs extraites</p>
                      <div className="border rounded-lg divide-y">
                        {Object.keys(valeurs).map((k) => (
                          <div key={k} className="flex gap-3 px-3 py-1.5">
                            <span className="text-slate-500 w-1/2">{k}</span><span className="text-slate-700 w-1/2">{String(valeurs[k])}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </Carte>
          );
        })}
      </div>
    </div>
  );
}

// --- Onglet ENTONNOIR : questions par thème, réponse libre, Valider / Passer --
// Encart « Avant synthèse » de l'onglet Cadrage : l'entonnoir adaptatif (inchangé).
function EncartEntonnoir({ client, projet, onSynthese, perime }) {
  const phase = projet.phase;
  const [reps, setReps] = useState(null);
  const [tours, setTours] = useState(null);          // bilans par tour
  const [drafts, setDrafts] = useState({});
  const [plies, setPlies] = useState({});
  const [actif, setActif] = useState(false);         // job entonnoir en cours
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [focusOuvert, setFocusOuvert] = useState(false);
  const [focusTexte, setFocusTexte] = useState('');

  const charger = useCallback(async () => {
    const { data } = await client.from('reponses_entonnoir')
      .select('id,strate,theme,question,reponse,statut,valide_humain,importance')
      .eq('projet_id', projet.id).eq('phase', phase)
      .order('strate', { ascending: true }).order('created_at', { ascending: true });
    setReps(data || []);
    const { data: tr } = await client.from('entonnoir_tours')
      .select('strate,statut_cadrage,justification,points_mineurs_json,focus')
      .eq('projet_id', projet.id).eq('phase', phase).order('strate', { ascending: true });
    setTours(tr || []);
    const { data: jobs } = await client.from('generation_jobs')
      .select('type').eq('projet_id', projet.id).in('statut', ['en_attente', 'en_cours']);
    setActif((jobs || []).some((j) => j.type === 'entonnoir_questions'));
  }, [client, projet.id, phase]);
  useEffect(() => { charger(); const t = setInterval(charger, 4000); return () => clearInterval(t); }, [charger]);

  const maxStrate = Math.max(
    (reps || []).reduce((m, r) => Math.max(m, r.strate || 0), 0),
    (tours || []).reduce((m, t) => Math.max(m, t.strate || 0), 0));
  const dernierTour = (tours || []).length ? tours[tours.length - 1] : null;
  const suffisant = dernierTour && dernierTour.statut_cadrage === 'suffisant';

  const demarrer = async (strate, focus) => {
    setBusy(true); setErr('');
    try {
      await client.from('generation_jobs').insert({
        projet_id: projet.id, type: 'entonnoir_questions', statut: 'en_attente',
        payload_json: focus ? { projet_id: projet.id, phase, strate, focus } : { projet_id: projet.id, phase, strate }
      });
      await pousserWorker(client);
      setFocusOuvert(false); setFocusTexte('');
      await charger();
    } catch (e) { setErr(e.message || String(e)); }
    setBusy(false);
  };

  const valider = async (r) => {
    await client.from('reponses_entonnoir').update({
      reponse: drafts[r.id] != null ? drafts[r.id] : (r.reponse || ''), statut: 'conforme', valide_humain: true
    }).eq('id', r.id);
    await charger();
  };
  const passer = async (r) => {
    await client.from('reponses_entonnoir').update({ statut: 'passee', valide_humain: true, reponse: null }).eq('id', r.id);
    setDrafts((d) => { const n = { ...d }; delete n[r.id]; return n; });
    await charger();
  };

  const groupes = useMemo(() => {
    const m = new Map();
    for (const r of (reps || [])) {
      const k = r.theme || 'autre';
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(r);
    }
    return Array.from(m, (e) => ({ theme: e[0], items: e[1] }));
  }, [reps]);

  const nbSansReponse = (reps || []).filter((r) => !r.valide_humain).length;

  if (reps === null || tours === null) return <Carte className="p-6"><p className="text-sm text-slate-400">Chargement…</p></Carte>;

  // Champ d'approfondissement ciblé (réutilisé par la carte-signal et le pied).
  const champFocus = (
    <div className="w-full mt-2">
      <p className="text-xs text-slate-500 mb-1">Quel point creuser ? (l'IA ciblera ce tour dessus)</p>
      <div className="flex gap-2">
        <input className="flex-1 border rounded-lg px-3 py-2 text-sm" placeholder="ex. la régulation / GTB, les limites avec le lot électricité…"
          value={focusTexte} onChange={(e) => setFocusTexte(e.target.value)} />
        <Bouton onClick={() => demarrer(maxStrate + 1, focusTexte.trim())} disabled={busy || actif || !focusTexte.trim()}>Creuser</Bouton>
        <Bouton variant="ghost" onClick={() => { setFocusOuvert(false); setFocusTexte(''); }}>Annuler</Bouton>
      </div>
    </div>
  );

  if (tours.length === 0) {
    return (
      <Carte className="p-6">
        <h2 className="font-semibold text-slate-800 mb-1">Entonnoir de cadrage — phase {libelle(PHASES, phase)}</h2>
        <p className="text-sm text-slate-500 mb-4">Entonnoir adaptatif : l'IA pose des questions tant qu'il reste des lacunes majeures, et signale quand le cadrage est suffisant. Chargez les pièces d'abord (elles nourrissent les questions).</p>
        {actif
          ? <p className="text-sm text-amber-700">Évaluation du cadrage en cours…</p>
          : <Bouton onClick={() => demarrer(1)} disabled={busy}>{busy ? '…' : "Démarrer l'entonnoir"}</Bouton>}
        {err && <p className="text-sm text-red-600 mt-3">{err}</p>}
      </Carte>
    );
  }

  return (
    <div className="space-y-4">
      {perime && (
        <Carte className="p-4 border-amber-200 bg-amber-50 flex items-center gap-3 flex-wrap">
          <span className="text-sm text-amber-800">🔄 Nouvelle(s) pièce(s) depuis le dernier tour — l'entonnoir pourrait avoir de nouvelles lacunes à explorer.</span>
          <span className="flex-1" />
          <Bouton variant="secondaire" onClick={() => demarrer(maxStrate + 1)} disabled={busy || actif}>Relancer l'entonnoir</Bouton>
        </Carte>
      )}
      <Carte className="p-4 flex items-center gap-3 flex-wrap">
        <h2 className="font-semibold text-slate-800">Entonnoir — phase {libelle(PHASES, phase)}</h2>
        <Badge>Tour {maxStrate}</Badge>
        {nbSansReponse > 0 && <Badge ton="attente">{nbSansReponse} sans réponse</Badge>}
        {actif && <span className="text-sm text-amber-700">Évaluation en cours…</span>}
        <span className="flex-1" />
        {!suffisant && <Bouton variant="secondaire" onClick={() => demarrer(maxStrate + 1)} disabled={busy || actif}>Continuer — évaluer le cadrage</Bouton>}
        <Bouton onClick={onSynthese}>Assez — synthétiser le contexte</Bouton>
      </Carte>

      {suffisant && (
        <Carte className="p-5 border-brand-200 bg-brand-50">
          <div className="flex items-center gap-2 mb-1">
            <span className="text-brand-700">✅</span>
            <h3 className="font-semibold text-brand-800">Cadrage suffisant pour la phase {libelle(PHASES, phase)}</h3>
          </div>
          {dernierTour.justification && <p className="text-sm text-slate-700 mb-2">{dernierTour.justification}</p>}
          {(dernierTour.points_mineurs_json || []).length > 0 && (
            <div className="mb-3">
              <p className="text-xs text-slate-500 mb-1">Points que vous pourriez préciser (optionnel) :</p>
              <ul className="text-sm text-slate-600 space-y-0.5">
                {(dernierTour.points_mineurs_json || []).map((p, i) => <li key={i} className="flex gap-2"><span className="text-brand-500 mt-0.5">•</span><span>{p}</span></li>)}
              </ul>
            </div>
          )}
          <p className="text-sm text-slate-600 mb-2">Prêt pour la synthèse — ou souhaitez-vous approfondir un point précis ?</p>
          <div className="flex gap-2 flex-wrap">
            <Bouton onClick={onSynthese}>Assez, synthétiser le contexte</Bouton>
            {!focusOuvert && <Bouton variant="secondaire" onClick={() => setFocusOuvert(true)} disabled={actif}>Approfondir un point…</Bouton>}
          </div>
          {focusOuvert && (
            <div>
              <p className="text-xs text-amber-700 mt-3">L'IA n'identifie plus de lacune majeure — vous demandez un approfondissement ciblé.</p>
              {champFocus}
            </div>
          )}
        </Carte>
      )}

      {groupes.map((g) => {
        const plie = plies[g.theme];
        return (
          <div key={g.theme} className="rounded-xl border border-slate-200 overflow-hidden">
            <button onClick={() => setPlies((p) => ({ ...p, [g.theme]: !p[g.theme] }))}
              className="w-full flex items-center justify-between gap-2 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-left">
              <span className="text-sm font-semibold text-slate-700">{plie ? '▸' : '▾'} {g.theme}</span>
              <span className="text-xs text-slate-500">{g.items.length} question(s)</span>
            </button>
            {!plie && (
              <div className="p-3 space-y-3 bg-white">
                {g.items.map((r) => (
                  <div key={r.id} className="border rounded-lg p-3">
                    <div className="flex items-start gap-2 mb-2">
                      <p className="text-sm text-slate-800 flex-1">{r.question}</p>
                      {r.importance === 'mineure' && <Badge ton="neutre">mineure</Badge>}
                      {r.valide_humain && <Badge ton={r.statut === 'passee' ? 'neutre' : 'ok'}>{r.statut === 'passee' ? '⏭️ passé' : '✅ validé'}</Badge>}
                    </div>
                    <textarea className="w-full border rounded-lg px-3 py-2 text-sm text-slate-700 font-sans"
                      rows={2} placeholder="Réponse libre…" value={drafts[r.id] != null ? drafts[r.id] : (r.reponse || '')}
                      onChange={(e) => setDrafts((d) => ({ ...d, [r.id]: e.target.value }))} />
                    <div className="flex gap-2 mt-2">
                      <Bouton variant="secondaire" onClick={() => valider(r)}>Valider</Bouton>
                      <Bouton variant="ghost" onClick={() => passer(r)}>Passer</Bouton>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
      {err && <p className="text-sm text-red-600">{err}</p>}
    </div>
  );
}

// --- Onglet CADRAGE : deux encarts par MOMENT (avant / après synthèse) ---------
